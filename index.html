<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>PHANTOM DECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@700;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0b0d16;--panel:#171b2c;--panel2:#242a44;--line:rgba(255,255,255,.12);
  --text:#eef1ff;--muted:#9aa3c7;--gold:#f5c542;--red:#ff5a64;--blue:#5aa9ff;--green:#5fe39a;
  --cw:64px;--hw:74px;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 45%,#1f2447 0%,#0b0d16 72%) fixed;overflow:hidden}
button{font-family:var(--body);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 12px;font-weight:800}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:linear-gradient(180deg,#ffd76a,#e0a51c);color:#2b1a00;border:none}
button.red{background:linear-gradient(180deg,#ff6b74,#c8323d);color:#fff;border:none}
button.blue{background:linear-gradient(180deg,#6cb6ff,#2f6fd6);color:#fff;border:none}
button.ghost{background:transparent}
button.sm{padding:6px 10px;font-size:12px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;gap:12px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.logo{text-align:center;margin-bottom:6px}
.logo .em{font-size:54px;filter:drop-shadow(0 0 18px rgba(255,190,80,.5));animation:float 3s ease-in-out infinite}
.logo h1{font-size:40px;letter-spacing:.04em;background:linear-gradient(180deg,#fff3c4,#f5c542 55%,#b8791a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2b00)}
.logo small{display:block;font-family:var(--display);color:var(--muted);letter-spacing:.35em;font-size:11px;margin-top:4px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:340px}
.menu button{padding:12px 6px;font-size:15px}
.menu .wide{grid-column:1/-1;padding:14px;font-size:16px}
.twr{display:flex;flex-direction:column;gap:6px;margin:6px 0}.twr div{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;font-size:14px}.twr b{color:var(--gold)}
.mydeck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);width:100%;max-width:300px;cursor:pointer}
.mydeck .ic{font-size:28px}
.mydeck .t{flex:1}
.mydeck .t small{display:block;color:var(--muted);font-size:11px}
.toggles{display:flex;gap:8px;margin-top:6px}
.rec{color:var(--muted);font-size:12px}

/* ---------- duel layout ---------- */
#duel{padding:4px 8px calc(4px + env(safe-area-inset-bottom));gap:4px;padding-top:max(4px,env(safe-area-inset-top))}
.pbar{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);flex:none;position:relative}
.pbar.turn{border-color:rgba(245,197,66,.7);box-shadow:0 0 10px rgba(245,197,66,.25)}
.pbar .av{font-size:20px}
.pbar .nm{font-weight:800;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .lp{font-family:var(--display);font-size:20px;color:#fff;min-width:74px;text-align:right}
.pbar .lp small{font-size:10px;color:var(--gold);margin-right:3px}
.pbar .lp.low{color:#ff8a8a}
.chips{display:flex;gap:4px}
.chip{font-size:11px;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.chip b{color:#fff;margin-left:2px}
#ophand{height:24px;display:flex;justify-content:center;gap:3px;flex:none}
#ophand .cb{width:17px;height:24px;border-radius:3px;background:radial-gradient(ellipse at 50% 50%,#d88b3a 0 20%,#4a2410 22% 30%,#7a3f18 32%);border:1px solid #2b1407}
.row{display:grid;grid-template-columns:repeat(5,var(--cw));justify-content:center;gap:6px;flex:none}
.zone{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:6px;border:1px dashed rgba(255,255,255,.13);display:grid;place-items:center;position:relative}
.row.mz .zone{background:rgba(255,130,80,.05)}
.row.st .zone{background:rgba(80,210,170,.05)}
#mid{flex:1;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.phases{display:flex;justify-content:center;gap:3px}
.phases span{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:800}
.phases span.on{background:var(--gold);color:#2b1a00}
.ctrl{display:flex;gap:6px;align-items:center}
.ctrl .logline{flex:1;min-width:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 4px}
.ctrl button{padding:8px 10px;font-size:12px}
.prompt{display:flex;align-items:center;gap:8px;background:rgba(245,197,66,.14);border:1px solid rgba(245,197,66,.5);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:800}
.prompt span{flex:1}
#myhand{--cw:var(--hw);height:calc(var(--hw)*1.42 + 10px);display:flex;justify-content:center;align-items:flex-end;flex:none;padding-bottom:2px}
#myhand .card{flex:none;transition:transform .15s}
#myhand .card.can{box-shadow:0 0 0 2px var(--green),0 0 10px rgba(95,227,154,.7);transform:translateY(-6px)}

/* ---------- cards ---------- */
.card{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:5px;position:relative;padding:calc(var(--cw)*.05);display:flex;flex-direction:column;gap:2px;background:var(--fr);box-shadow:0 2px 6px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.35);color:#1a1205;overflow:hidden;cursor:pointer}
.card.monster.normal{--fr:linear-gradient(160deg,#f3d685,#b98d2e)}
.card.monster.effect{--fr:linear-gradient(160deg,#f5a868,#b45a1e)}
.card.monster.fusion{--fr:linear-gradient(160deg,#c4a0ff,#6a3fb3)}
.card.spell{--fr:linear-gradient(160deg,#6ddcb6,#1f7a5c)}
.card.trap{--fr:linear-gradient(160deg,#ee8fbf,#922f63)}
.card.monster.synchro,.big.monster.synchro{--fr:linear-gradient(160deg,#ffffff,#aab4c6)}
.card.monster.xyz,.big.monster.xyz{--fr:linear-gradient(160deg,#4d4d5c,#121218);color:#f3e9c6}
.card.monster.link,.big.monster.link{--fr:linear-gradient(160deg,#63a8ff,#1d4fa8);color:#fff}
.card.xyz .st .up,.card.link .st .up{color:#8dffa8}
.card .lv.rk{color:#1a1205;text-shadow:0 0 2px #ffe066,0 0 2px #ffe066}
.card .lv.lk{color:#bfe0ff}
.card .tn{position:absolute;left:2px;bottom:1px;font-size:calc(var(--cw)*.12);font-weight:800;background:#1d6b3a;color:#fff;border-radius:3px;padding:0 2px;line-height:1.2}
.card .ov{position:absolute;right:2px;bottom:1px;font-size:calc(var(--cw)*.13);font-weight:800;color:#ffe066;text-shadow:0 0 2px #000,0 0 2px #000}
.chip.can{border-color:var(--green);color:#fff;box-shadow:0 0 8px rgba(95,227,154,.7);animation:pulse .7s infinite alternate}
#editor{padding:6px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.edtop{display:flex;align-items:center;gap:8px;min-height:44px;flex:none}
.edtop .nm{flex:1;min-width:0}
.edtop .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edtop .nm small{font-size:12px;color:var(--muted)}
.edtop .nm small b{display:inline;font-size:12px;color:#fff}
.edtop .nm small b.ng{color:#ff8a8a}
.edtabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 6px;flex:none}
.edtabs button{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
.edtabs button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.edgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 6px;padding:8px 2px 12px;align-content:start}
.eitem{position:relative;display:flex;justify-content:center}
.eitem .card{--cw:64px}
.eitem.zero .card{opacity:.5}
.eitem .cnt{position:absolute;top:-6px;right:0;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 7px;z-index:2}
.edbot{display:flex;gap:6px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));flex:none}
.edbot button{flex:1;padding:10px 4px;font-size:13px}
#modal input{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.card .nm{font-size:calc(var(--cw)*.125);font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.card .art{flex:1;border-radius:3px;background:radial-gradient(circle at 50% 38%,var(--a1),var(--a2));display:grid;place-items:center;font-size:calc(var(--cw)*.4);position:relative;border:1px solid rgba(0,0,0,.35);min-height:0;line-height:1}
.card .lv{position:absolute;top:1px;right:2px;font-size:calc(var(--cw)*.12);color:#ffe066;text-shadow:0 0 2px #000,0 0 2px #000;font-weight:800;line-height:1}
.card .st{display:flex;justify-content:space-between;font-weight:800;font-size:calc(var(--cw)*.15);letter-spacing:-.03em;line-height:1;flex:none}
.card .st span{opacity:.45}
.card .st span.on{opacity:1}
.card .st .up{color:#064d16}.card .st .dn{color:#7a0a0a}
.card .st.sp{justify-content:center;font-family:var(--body);font-weight:800;font-size:calc(var(--cw)*.13);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card.back{background:radial-gradient(ellipse at 50% 50%,#e39a45 0 18%,#4a2410 20% 28%,#7a3f18 30% 60%,#5a2c10 62%);border:2px solid #2b1407}
.card.back::before{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#ffe2a8;font-size:calc(var(--cw)*.22)}
.card.fd{filter:saturate(.55) brightness(.75)}
.card.fd::after{content:'セット';position:absolute;left:0;right:0;top:42%;text-align:center;font-size:calc(var(--cw)*.14);background:rgba(0,0,0,.65);color:#fff;font-weight:800}
.zone .card.def{transform:rotate(-90deg) scale(.7)}
.card.t{outline:3px solid #ffe14a;outline-offset:1px;animation:pulse .7s infinite alternate}
.card.mk{outline:3px solid #ff5a64;outline-offset:1px}
.card.ready{box-shadow:0 0 0 2px var(--red),0 0 12px var(--red)}
.card.appear{animation:appear .35s ease-out}
.zone .card.def.appear{animation:appearDef .35s ease-out}
.card.flip{animation:flipin .4s ease-out}
.zone .card.def.flip{animation:flipinDef .4s ease-out}
.card.boom{animation:boom .45s forwards}
.zone .card.def.boom{animation:boomDef .45s forwards}
.card .eq{position:absolute;left:2px;top:1px;font-size:calc(var(--cw)*.13)}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
@keyframes appear{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
@keyframes appearDef{from{transform:rotate(-90deg) scale(1.3);opacity:0}to{transform:rotate(-90deg) scale(.7);opacity:1}}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
@keyframes flipinDef{from{transform:rotate(-90deg) scale(.7) rotateX(90deg)}to{transform:rotate(-90deg) scale(.7)}}
@keyframes boom{0%{filter:brightness(1)}30%{filter:brightness(3) saturate(0);transform:scale(1.1)}100%{opacity:0;transform:scale(.3) rotate(25deg);filter:brightness(3)}}
@keyframes boomDef{0%{filter:brightness(1)}30%{filter:brightness(3) saturate(0)}100%{opacity:0;transform:rotate(-60deg) scale(.2)}}
@keyframes float{50%{transform:translateY(-6px)}}

/* big card */
.big{--cw:200px;width:min(62vw,220px);margin:0 auto;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;background:var(--fr);color:#1a1205;box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.3)}
.big.monster.normal{--fr:linear-gradient(160deg,#f3d685,#b98d2e)}
.big.monster.effect{--fr:linear-gradient(160deg,#f5a868,#b45a1e)}
.big.monster.fusion{--fr:linear-gradient(160deg,#c4a0ff,#6a3fb3)}
.big.spell{--fr:linear-gradient(160deg,#6ddcb6,#1f7a5c)}
.big.trap{--fr:linear-gradient(160deg,#ee8fbf,#922f63)}
.big .bn{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;background:rgba(255,255,255,.35);border-radius:5px;padding:3px 6px}
.big .bn i{font-style:normal;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.big .stars{font-size:12px;color:#c0392b;text-align:right;letter-spacing:-1px;min-height:14px}
.big .bart{height:min(38vw,140px);border-radius:5px;background:radial-gradient(circle at 50% 38%,var(--a1),var(--a2));display:grid;place-items:center;font-size:min(20vw,76px);border:2px solid rgba(0,0,0,.4)}
.big .btx{color:#1a1205;background:rgba(255,248,230,.88);border-radius:5px;padding:6px 7px;font-size:12px;line-height:1.45;min-height:64px}
.big .btx b{display:block;font-size:11px}
.big .bst{display:flex;justify-content:flex-end;gap:10px;font-family:var(--display);font-size:14px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70}
#modal .box{width:100%;max-width:520px;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out;border-top:1px solid var(--line)}
#modal h3{font-size:17px;margin-bottom:10px;text-align:center}
#modal .desc{font-size:13px;color:#cfd5f5;line-height:1.6;margin:0 0 10px}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer}
.pitem .card{--cw:46px;flex:none}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:13px}
.pinfo small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.seg{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;font-size:13px}
.seg button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.lab{font-size:12px;color:var(--muted);font-weight:800}
.opp{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;margin-bottom:8px}
.opp .ic{font-size:30px}
.opp .t{flex:1}
.opp .t small{display:block;color:var(--muted);font-size:11px}
.opp.lock{opacity:.4;cursor:default}
.opp .badge{font-size:11px;font-weight:800;color:var(--green)}
.talk{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.05);border-radius:12px;padding:12px;margin-bottom:6px}
.talk .ic{font-size:34px}
.talk p{margin:0;font-size:14px;line-height:1.6}
.talk b{display:block;font-size:12px;color:var(--gold)}
.rules{font-size:13px;line-height:1.7;color:#d7dcf5}
.rules h4{margin:12px 0 4px;color:var(--gold);font-size:14px}
.rules ul{margin:0;padding-left:18px}
.loglist{font-size:12px;line-height:1.6;color:#cfd5f5;max-height:55vh;overflow:auto}
.loglist div{border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}
.loglist .t0{color:#9fd0ff}.loglist .t1{color:#ffb0b0}
.decklist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.decklist .card{--cw:min(17vw,84px)}
.card.r-SR{box-shadow:0 0 0 2px #ffd34d,0 0 10px rgba(255,211,77,.8)}
.card.r-UR{box-shadow:0 0 0 2px #fff,0 0 10px #ff6bd6,0 0 18px #6bc8ff;animation:urglow 2s linear infinite}
@keyframes urglow{50%{filter:hue-rotate(40deg) brightness(1.15)}}
.rar{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.rar.N{background:#5b6280;color:#fff}.rar.R{background:#3a8dde;color:#fff}.rar.SR{background:linear-gradient(90deg,#ffd34d,#f5a623);color:#3a2300}.rar.UR{background:linear-gradient(90deg,#ff6bd6,#6bc8ff,#7dffb0);color:#1a1030}
.ptsbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.4);font-weight:800;width:100%;max-width:300px}
.ptsbar b{font-family:var(--display);font-size:20px;color:var(--gold)}
.ptsbar span{flex:1}
#packs{padding:6px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.pktop{display:flex;align-items:center;gap:8px;min-height:44px;flex:none}
.pktop .t{flex:1;font-family:var(--display);font-size:18px}
.pktop .pts{font-weight:800;color:var(--gold)}
.pktabs{display:flex;gap:6px;padding:4px 0 8px;flex:none;overflow-x:auto}
.pktabs button{padding:6px 12px;font-size:12px;flex:none}
.pktabs button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.pkbody{flex:1;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.pack{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:10px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.pack .pic{width:64px;height:88px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:34px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 0 18px rgba(255,255,255,.2)}
.pack .t{flex:1;min-width:0}
.pack .t b{display:block;font-size:15px}
.pack .t small{display:block;font-size:11px;color:rgba(255,255,255,.8);line-height:1.5}
.pack .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden}
.pack .bar i{display:block;height:100%;background:var(--gold)}
.pack button{flex:none;padding:10px 10px;font-size:12px}
.pkinfo{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 0 12px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 6px;padding:4px 2px 12px}
.colgrid .eitem .card.back{--cw:64px;opacity:.35}
.colgrid .eitem .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;pointer-events:none}
.opening{position:fixed;inset:0;z-index:55;background:radial-gradient(ellipse at 50% 40%,#2b2560,#07080f 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;animation:fadein .3s}
.opening h3{font-size:20px}
.opening .row5{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:440px}
.opening .slot{--cw:min(26vw,104px);position:relative;perspective:600px}
.opening .slot .card{transition:transform .35s}
.opening .slot.fresh .card{animation:dealin .4s ease-out backwards}
@keyframes dealin{from{transform:translateY(60px) scale(.6);opacity:0}}

.ill{position:relative;overflow:hidden;isolation:isolate}

.big .ill .fl,.opening .ill .fl{animation:foil 3.2s linear infinite}

.ill>span:not(.sj){z-index:3}

/* ===== デュエルリンクス風スキン ===== */
:root{--bg:#040a1c;--panel:#0b1736;--panel2:#13285a;--line:rgba(90,200,255,.28);--muted:#8fb0d8;--cy:#38d6ff;--cy2:#1a7dff;--num:"Orbitron","Dela Gothic One",sans-serif;
 --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);--cuts:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
body{background:
 linear-gradient(115deg,transparent 38%,rgba(70,190,255,.10) 44%,transparent 50%),
 linear-gradient(65deg,transparent 58%,rgba(120,90,255,.10) 63%,transparent 69%),
 repeating-linear-gradient(60deg,rgba(80,180,255,.05) 0 1px,transparent 1px 26px),
 repeating-linear-gradient(-60deg,rgba(80,180,255,.05) 0 1px,transparent 1px 26px),
 radial-gradient(ellipse 90% 60% at 50% 0%,#14408a 0%,transparent 70%),
 radial-gradient(ellipse 80% 50% at 50% 100%,#0d2a66 0%,transparent 75%),
 linear-gradient(180deg,#071230,#030714) fixed}
#app::before{content:'';position:absolute;inset:-20% -60%;pointer-events:none;background:linear-gradient(105deg,transparent 45%,rgba(140,220,255,.08) 49%,rgba(255,255,255,.12) 50%,rgba(140,220,255,.08) 51%,transparent 55%);animation:sweep 7s linear infinite;z-index:0}
@keyframes sweep{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
.screen{z-index:1}
/* buttons */
button{clip-path:var(--cut);border-radius:0;border:none;font-style:italic;letter-spacing:.02em;
 background:linear-gradient(180deg,#2a4f9a 0%,#16306b 48%,#0e2152 52%,#14336f 100%);
 box-shadow:inset 0 0 0 1px rgba(120,210,255,.55),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -8px 14px rgba(0,0,0,.25);
 text-shadow:0 1px 0 rgba(0,0,0,.6);color:#eaf6ff;transition:filter .12s,transform .08s}
button:hover:not(:disabled){filter:brightness(1.18)}
button.sm{clip-path:var(--cuts);border-radius:0}
button.pri{background:linear-gradient(180deg,#ffe28a 0%,#ffb21e 46%,#f08a00 54%,#ffb52e 100%);color:#3a1800;text-shadow:0 1px 0 rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px rgba(255,245,200,.8),inset 0 1px 0 #fff,inset 0 -8px 14px rgba(160,60,0,.25)}
button.red{background:linear-gradient(180deg,#ff8a8f 0%,#e2323f 48%,#b3141f 54%,#e03440 100%);box-shadow:inset 0 0 0 1px rgba(255,190,190,.7),inset 0 1px 0 rgba(255,255,255,.5)}
button.blue{background:linear-gradient(180deg,#7fe3ff 0%,#22a8f0 46%,#0a6fd0 54%,#1d95ea 100%);box-shadow:inset 0 0 0 1px rgba(200,245,255,.85),inset 0 1px 0 #fff}
button.ghost{background:rgba(20,50,110,.35);box-shadow:inset 0 0 0 1px rgba(120,210,255,.4)}
h1,h2,h3{font-style:italic}
/* title */
.logo .em{font-size:44px;filter:drop-shadow(0 0 14px rgba(60,200,255,.9)) drop-shadow(0 0 30px rgba(60,120,255,.6))}
.logo h1{font-size:44px;transform:skewX(-8deg);background:linear-gradient(180deg,#ffffff 0%,#d8f4ff 30%,#5cc8ff 55%,#1a5fd0 56%,#7fe0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #001a4a) drop-shadow(0 0 10px rgba(56,214,255,.75))}
.logo small{font-family:var(--num);font-weight:900;color:var(--cy);letter-spacing:.5em;text-shadow:0 0 8px rgba(56,214,255,.8);font-style:italic}
.logo{position:relative;padding:6px 26px 10px}
.logo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),#fff,var(--cy),transparent);box-shadow:0 0 10px var(--cy)}
.menu button{padding:13px 6px;font-size:15px}
.menu .wide{padding:15px;font-size:17px}
.ptsbar,.mydeck,.opp,.pitem,.talk,.mis,.twr div,.bonbox,.prompt{clip-path:var(--cut);border-radius:0;border:none;background:linear-gradient(100deg,rgba(30,70,150,.75),rgba(10,25,65,.85));box-shadow:inset 0 0 0 1px rgba(90,200,255,.38),inset 3px 0 0 var(--cy)}
.ptsbar b{font-family:var(--num);font-style:italic;color:#ffd84a;text-shadow:0 0 8px rgba(255,200,60,.6)}
.opp:hover,.mydeck:hover,.pitem:hover{filter:brightness(1.2)}
.opp.lock{filter:grayscale(.7)}
.toggles button{font-size:11px}
/* panels / modal */
#modal{background:rgba(0,6,20,.72);backdrop-filter:blur(2px)}
#modal .box{border-radius:0;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%,0 18px);background:
 repeating-linear-gradient(60deg,rgba(80,180,255,.04) 0 1px,transparent 1px 22px),linear-gradient(180deg,#10265a,#081430 40%,#050c22);border:none;box-shadow:inset 0 2px 0 var(--cy),inset 0 0 0 1px rgba(90,200,255,.3)}
#modal h3{font-size:19px;color:#fff;text-shadow:0 0 10px rgba(56,214,255,.8);padding-bottom:8px;position:relative}
#modal h3::after{content:'';position:absolute;left:20%;right:20%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
.seg button.on,.edtabs button.on,.pktabs button.on{background:linear-gradient(180deg,#9df0ff,#20b6f5 50%,#0b7fd8);color:#002040;text-shadow:none;box-shadow:inset 0 0 0 1px #e6fbff,0 0 10px var(--cy)}
.lab,.rules h4,.talk b{color:var(--cy)}
.pktop .t,#modal h3{letter-spacing:.04em}
.pktop .t{text-shadow:0 0 10px rgba(56,214,255,.7)}
.pack{border-radius:0;clip-path:var(--cut);border:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.pack::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 55%);pointer-events:none}
.pack{position:relative}
.pack .pic{border-radius:4px}
/* duel */
#field{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;position:relative;isolation:isolate}
#field::before{content:'';position:absolute;inset:-2px -6px;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse 70% 30% at 50% 50%,rgba(56,214,255,.22),transparent 70%),
 linear-gradient(180deg,rgba(255,70,90,.10),transparent 30%,transparent 70%,rgba(56,160,255,.14)),
 repeating-linear-gradient(90deg,rgba(90,200,255,.07) 0 1px,transparent 1px 40px),
 repeating-linear-gradient(0deg,rgba(90,200,255,.07) 0 1px,transparent 1px 40px),
 linear-gradient(180deg,#0a1840,#061032 50%,#0a1a48);
 box-shadow:inset 0 0 0 1px rgba(90,200,255,.3),inset 0 0 40px rgba(0,0,0,.6)}
#field::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(56,214,255,.8),transparent);box-shadow:0 0 8px var(--cy);pointer-events:none;z-index:-1}
.zone{border-radius:3px;border:1px solid rgba(90,200,255,.32);box-shadow:inset 0 0 12px rgba(40,160,255,.2)}
.row.mz .zone{background:linear-gradient(180deg,rgba(40,120,255,.16),rgba(10,40,120,.08))}
.row.st .zone{background:linear-gradient(180deg,rgba(40,220,190,.12),rgba(10,80,90,.06));border-color:rgba(70,230,200,.28)}
.zone::before{content:'';position:absolute;inset:3px;border:1px solid rgba(140,220,255,.12);border-radius:2px;pointer-events:none}
.pbar{height:40px;border-radius:0;border:none;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);padding:0 16px;
 background:linear-gradient(100deg,rgba(20,55,130,.95),rgba(8,20,55,.95) 60%,rgba(20,55,130,.9));box-shadow:inset 0 0 0 1px rgba(90,200,255,.35)}
#opbar{background:linear-gradient(100deg,rgba(120,25,45,.92),rgba(40,8,25,.95) 60%,rgba(120,25,45,.9));box-shadow:inset 0 0 0 1px rgba(255,120,140,.4)}
.pbar.turn{box-shadow:inset 0 0 0 2px #ffd84a,inset 0 0 14px rgba(255,216,74,.45);animation:turnglow 1.2s ease-in-out infinite alternate}
@keyframes turnglow{to{filter:brightness(1.18)}}
.pbar .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:radial-gradient(circle at 40% 35%,#2b5fb8,#0a1a45);box-shadow:0 0 0 2px var(--cy),0 0 8px var(--cy);flex:none}
#opbar .av{background:radial-gradient(circle at 40% 35%,#b83050,#3a0a18);box-shadow:0 0 0 2px #ff6b80,0 0 8px #ff6b80}
.pbar .nm{font-style:italic}
.pbar .lp{font-family:var(--num);font-weight:900;font-style:italic;font-size:21px;min-width:84px;color:#fff;text-shadow:0 0 8px rgba(56,214,255,.9),0 2px 0 #001030}
#opbar .lp{text-shadow:0 0 8px rgba(255,100,120,.9),0 2px 0 #300010}
.pbar .lp small{font-family:var(--num);color:#ffd84a;font-size:10px}
.pbar .lp.low{color:#ff8a8a;animation:pulse .5s infinite alternate}
.lpg{position:absolute;left:14px;right:14px;bottom:2px;height:4px;background:rgba(0,0,0,.55);pointer-events:none}
.lpg b{display:block;height:100%;background:linear-gradient(90deg,#1aff9c,#38d6ff);box-shadow:0 0 6px #38d6ff;transition:width .3s}
.lpg.mid b{background:linear-gradient(90deg,#ffd84a,#ffa21a)}.lpg.low b{background:linear-gradient(90deg,#ff3a4a,#ff8a5a)}
.chip{border-radius:0;clip-path:var(--cuts);background:rgba(0,10,30,.6);border:none;box-shadow:inset 0 0 0 1px rgba(90,200,255,.35);color:#a8c8ee}
.phases span{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:2px 10px;background:rgba(20,50,110,.6);font-style:italic}
.phases span.on{background:linear-gradient(180deg,#9df0ff,#20b6f5);color:#002040;box-shadow:0 0 10px var(--cy)}
.phases span:last-child{clip-path:none;color:#fff;text-shadow:0 0 6px var(--cy);font-style:italic}
.prompt{background:linear-gradient(100deg,rgba(140,100,10,.6),rgba(60,40,0,.75));box-shadow:inset 0 0 0 1px rgba(255,216,74,.6),inset 3px 0 0 #ffd84a}
#ophand .cb{border-radius:2px;background:linear-gradient(135deg,#3a1d0c,#8a4a1a 50%,#3a1d0c);box-shadow:0 0 0 1px #c9893c,0 0 4px rgba(0,0,0,.6)}
#myhand .card:hover{transform:translateY(-8px)}
#myhand .card.can{box-shadow:0 0 0 2px #7dffd0,0 0 14px rgba(56,214,255,.95);transform:translateY(-8px)}
.card{border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.card.back{background:radial-gradient(circle at 50% 50%,#ffd27a 0 9%,#7a3a10 11% 15%,transparent 16%),repeating-conic-gradient(from 0deg at 50% 50%,#5a2a0e 0 15deg,#8a4a1a 15deg 30deg),#5a2a0e;border:2px solid #c9893c;box-shadow:inset 0 0 0 2px #3a1a06,0 3px 8px rgba(0,0,0,.6)}
.card.back::before{content:''}
.card.ready{box-shadow:0 0 0 2px #ffd84a,0 0 14px #ff8a1a}
.card.t{outline:3px solid #38d6ff;box-shadow:0 0 14px #38d6ff}
/* banners */
.banner{font-style:italic;font-size:32px;padding:14px 0;transform-origin:center;background:linear-gradient(90deg,transparent,rgba(10,60,160,.92) 15%,rgba(20,100,220,.95) 50%,rgba(10,60,160,.92) 85%,transparent);box-shadow:0 -2px 0 rgba(56,214,255,.8),0 2px 0 rgba(56,214,255,.8);text-shadow:0 0 14px #38d6ff,0 3px 0 #001a4a;letter-spacing:.06em}
.banner small{font-family:var(--num);font-style:italic;color:#bfefff;letter-spacing:.3em}
.actov .lbl{font-style:italic;font-size:26px}
.result{background:radial-gradient(ellipse at 50% 45%,rgba(20,70,170,.6),rgba(2,6,18,.92) 70%)}
.result h1{font-size:60px;transform:skewX(-8deg)}
.result h1.win{background:linear-gradient(180deg,#fff 0%,#ffe9a0 40%,#ffb21e 55%,#ffdf7a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,190,40,.8))}
.big{border-radius:4px}
.toast{border-radius:0;clip-path:var(--cut);background:linear-gradient(100deg,#163a82,#0a1a45);box-shadow:inset 0 0 0 1px var(--cy)}
.opening{background:radial-gradient(ellipse at 50% 40%,#1a4aa8,#020616 75%)}
.logo .logoimg{display:block;width:min(100%,400px);height:auto;margin:0 auto;-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);filter:drop-shadow(0 0 18px rgba(56,150,255,.35))}
#title{justify-content:flex-start}#title>.logo{margin-top:auto}#title>.rec{margin-bottom:auto}
.logo{padding:0 0 4px;margin-bottom:0}.logo::after{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip .ctrb{color:#ffd84a;margin-left:3px;text-shadow:0 0 6px #ffb21e}
.lgrid div{border-radius:0;clip-path:var(--cuts);background:linear-gradient(180deg,#1c3a7a,#0c1d48);box-shadow:inset 0 0 0 1px rgba(90,200,255,.3)}
.lgrid div.got{background:linear-gradient(180deg,#ffe28a,#f0a000)}
.mis .bar i,.pack .bar i{background:linear-gradient(90deg,#38d6ff,#9df0ff);box-shadow:0 0 6px #38d6ff}

const FUSB={次元:['callBan',4],剣闘士:['dbl'],人形:['callD',4],氷河:['freeze'],錬金術:['raise',4],王国:['placeCont'],結界:['setTrap'],星騎士:['atk',600],深海:['freeze'],忍:['search'],雷神:['burn',800],獣王:['dbl'],死霊:['draw',1],花妖精:['heal',1500],天使:['raise',4],恐竜:['killWeak',1500],昆虫:['callD',2],冥王:['payKill'],侍:['pierce'],海賊:['draw',2],妖怪:['raid'],精霊:['prism',300],時計仕掛け:['searchSpT'],魔導:['draw',1]};
function FUSBT(T){const[k,v]=FUSB[T]||[];return({callBan:`除外されている自分のレベル${v}以下の「${T}」モンスター1体を特殊召喚できる。`,atk:`そのモンスターの攻撃力は${v}アップする。`,freeze:'相手フィールドの攻撃表示モンスターを全て守備表示にする。',search:`デッキからレベル4以下の「${T}」モンスター1体を手札に加える。`,burn:`相手に${v}ダメージを与える。`,dbl:'そのモンスターはこのターン2回攻撃できる（2回目はモンスターへの攻撃に限る）。',draw:`カードを${v}枚ドローする。`,heal:`自分のLPを${v}回復する。`,raise:`自分の墓地からレベル${v}以下の「${T}」モンスター1体を特殊召喚できる。`,killWeak:`相手フィールドの攻撃力${v}以下の表側モンスターを全て破壊する。`,callD:`デッキからレベル${v}以下の「${T}」モンスター1体を特殊召喚する。`,payKill:'1000LPを払って、相手フィールドのモンスター1体を破壊できる（LPが1000より多い場合）。',pierce:'そのモンスターはこのターン、守備表示モンスターを攻撃した時に貫通ダメージを与える。',raid:'相手の手札をランダムに1枚選んで墓地へ送る。',prism:`そのモンスターの攻撃力は、自分フィールドの表側モンスターの属性の種類×${v}アップする。`,searchSpT:`デッキから「${T}」魔法・罠カード1枚を手札に加える。`,setTrap:'デッキから罠カード1枚を選んで自分フィールドにセットする。',placeCont:`デッキから「${T}」永続魔法1枚を自分フィールドに表側表示で置く。`})[k]||''}
async function fusionBonus(p,sp,f){
  const T=sp.d.theme,[k,v]=FUSB[T]||[],o=opp(p);if(!k||G.over)return;
  log(`${Q(sp)}の追加効果！`,p.idx);
  if(k==='atk'&&onField(f)){f.boost+=v;log(`${Q(f)}の攻撃力が${v}アップ`,p.idx);sfx('heal')}
  else if(k==='prism'&&onField(f)){const n=new Set(monsters(p).filter(m=>m.faceUp).map(m=>m.d.attr)).size;f.boost+=v*n;log(`${Q(f)}の攻撃力が${v*n}アップ`,p.idx);sfx('heal')}
  else if(k==='freeze'){monsters(o).filter(m=>m.faceUp&&m.pos==='atk'&&m.d.kind!=='link'&&!immune(m)).forEach(m=>m.pos='def');log('相手モンスターが全て守備表示になった',p.idx);sfx('set')}
  else if(k==='search')await searchDeck(p,sp,x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===T&&x.d.lv<=4,true);
  else if(k==='placeCont')await placeFromDeck(p,sp,'cont');
  else if(k==='setTrap'){const cs=p.deck.filter(x=>x.d.type==='trap');if(cs.length&&freeSz(p)>=0){const t=p.cpu?cs[0]:await ask(p,()=>modal({title:'セットする罠カードを選択',cards:cs.filter((x,i)=>cs.findIndex(y=>y.id===x.id)===i),closable:false}));if(t){removeCard(t);t.faceUp=false;t.setTurn=G.turn-1;p.sz[freeSz(p)]=t;shuffle(p.deck);log(`${p.name}はデッキから罠カードをセットした`,p.idx);sfx('set')}}}
  else if(k==='searchSpT')await searchDeck(p,sp,x=>x.d.type!=='monster'&&x.d.theme===T,true);
  else if(k==='burn')await damage(o,v);
  else if(k==='dbl'&&onField(f)){f.dblTurn=G.turn;log(`${Q(f)}はこのターン2回攻撃できる`,p.idx)}
  else if(k==='pierce'&&onField(f)){f.pierceTurn=G.turn;log(`${Q(f)}はこのターン貫通ダメージを与える`,p.idx)}
  else if(k==='draw')await draw(p,v);
  else if(k==='heal')await heal(p,v);
  else if(k==='raise'){const t=await pickSS(p,sp,p.grave.filter(x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===T&&x.d.lv<=v),`${sp.d.name}の効果：墓地から特殊召喚する「${T}」を選択`,true);if(t)await putSS(p,t,`${Q(sp)}の効果で墓地から`)}
  else if(k==='callBan'){const t=await pickSS(p,sp,p.ban.filter(x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===T&&x.d.lv<=v),`${sp.d.name}の効果：除外から特殊召喚する「${T}」を選択`,true);if(t)await putSS(p,t,`${Q(sp)}の効果で除外から`)}
  else if(k==='callD'){const t=await pickSS(p,sp,p.deck.filter(x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===T&&x.d.lv<=v),`${sp.d.name}の効果：デッキから特殊召喚する「${T}」を選択`,false);if(t){await putSS(p,t,`${Q(sp)}の効果で`);shuffle(p.deck)}}
  else if(k==='killWeak'){const cs=monsters(o).filter(m=>m.faceUp&&atkOf(m)<=v);if(cs.length)await destroyMany(cs)}
  else if(k==='raid'){if(o.hand.length){const t=o.hand[rnd(o.hand.length)];toGrave(t);log(`${o.name}の手札の${Q(t)}が墓地へ送られた`,p.idx);sfx('destroy')}}
  else if(k==='payKill'){const cs=monsters(o);if(cs.length&&p.lp>1000){const ok=p.cpu?true:await ask(p,()=>modal({title:`${sp.d.name}の追加効果`,html:'<p class="desc">1000LPを払って相手モンスター1体を破壊しますか？</p>',buttons:[{label:'払って破壊する',value:true,cls:'red'},{label:'しない',value:false,cls:'ghost'}],closable:false}));
    if(ok){const from=p.lp;p.lp-=1000;log(`${p.name}は1000LPを払った`,p.idx);await animLP(p,from,p.lp);const t=await chooseTarget(p,monsters(o),`${sp.d.name}の効果：破壊するモンスターを選択`,'kill');if(t)await destroyMany([t])}}}

async function draw(p,n=1){

}

  switch(k){case 'T':return tm.some(m=>m.faceUp);case 'ban':return p.grave.some(x=>x!==c&&x.d.theme===T);case 'ban3':return p.ban.length>=3;case 'def':return tm.some(m=>m.pos==='def');case 'many2':return tm.filter(m=>m.faceUp).length>=2;
    case 'grave3':return p.grave.filter(x=>x.d.type==='monster'&&x.d.theme===T).length>=3;case 'burn':return(G.burnT||[])[p.idx]===G.turn;case 'heal':return(G.healT||[])[p.idx]===G.turn;
    case 'lp':return p.lp>opp(p).lp;case 'spell':return(G.spellT||[])[p.idx]===G.turn;case 'cont':return contCards(p).length>0;case 'field':return !!p.fz[0];case 'neg':return G.turn-((G.negT||[])[p.idx]??-9)<=1;case 'st2':return sts(p).filter(x=>!x.faceUp).length>=2;case 'pay':return p.lp>1000;case 'hit':return(G.hitT||[])[p.idx]===G.turn;case 'set':return monsters(p).some(m=>m!==c&&!m.faceUp);case 'attr2':return new Set(monsters(p).filter(m=>m!==c&&m.faceUp).map(m=>m.d.attr)).size>=2;case 'turn':return G.turn>=5;case 'empty':return monsters(p).length===0;case 'disc':return p.hand.some(x=>x!==c&&x.d.theme===T);case 'ctr':return ctrOf(p)>=2}return false}
const tribNeed=(c,p)=>{if(has(c,'god'))return 3;let b=c.d.lv>=7?2:c.d.lv>=5?1:0;if(b&&p&&has(c,'easy')&&ssCond(p,c,ev(c,'easy')))b--;if(b&&p&&c.d.theme&&pfx(p,'fEasyT').some(f=>f.c.d.theme===c.d.theme))b--;return b};
const tribVal=(m,c)=>has(m,'godTrib')&&has(c,'god')?2:(has(m,'doubleTribute')&&c.d.race==='ドラゴン')||(has(m,'dblTribT')&&m.d.theme&&m.d.theme===c.d.theme)?2:1;
const tribCap=(p,c)=>sum(monsters(p).map(m=>tribVal(m,c)));
function canNormal(p,c){
  if(p.ns||!isMain()||G.cur!==p.idx||c.d.type!=='monster'||isExtra(c))return false;

const gyK=c=>c.d.gy||(c.d.type==='monster'?ev(c,'gy')||null:null);
function canGy(p,c){const k=gyK(c);if(!k||!G||G.over||G.cur!==p.idx||!isMain()||!p.grave.includes(c)||(p.gyUsed||{})[c.id]===G.turn)return false;

  while(!G.over&&G.pend&&G.pend.length){const[c,z]=G.pend.shift();if(where(c)?.z!=='grave')continue;const p=G.p[c.owner],k=sentK(c,z),o=opp(p);const so=G.src;G.src={k:c.d.type,p:p.idx};try{

function fmatOk(cond,x){if(x.d.type!=='monster')return false;if(typeof cond==='string')return x.id===cond;if(cond.theme)return x.d.theme===cond.theme;if(cond.race)return x.d.race===cond.race;if(cond.attr)return x.d.attr===cond.attr;return true}

  if(p.cpu){if(kind==='st')return cands[rnd(cands.length)];return maxBy(cands,threat)}

}
function modal({title='',html='',buttons=[],cards=null,cardLabel=null,closable=true,state=null}){
  return new Promise(res=>{
    ui.modal=true;const m=$('#modal');m.hidden=false;
    m.innerHTML=`<div class="box">${title?`<h3>${title}</h3>`:''}${html}${cards?`<div class="plist">${cards.map((c,i)=>`<div class="pitem" data-i="${i}">${cardHTML(c,{plain:true})}<div class="pinfo"><b>${c.d.name}</b><small>${cardLabel?cardLabel(c):subText(c)}</small><small>${c.d.text.replace(/\n/g,'<br>')}</small></div></div>`).join('')}</div>`:''}<div class="btns">${buttons.map((b,i)=>`<button class="${b.cls||''}" data-b="${i}" ${b.disabled?'disabled':''}>${b.label}</button>`).join('')}</div></div>`;
    const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;ui.modal=false;res(v)};
    m.onclick=e=>{
      const sg=e.target.closest('[data-seg]');if(sg&&state){const[k,v]=sg.dataset.seg.split(':');state[k]=isNaN(+v)?v:+v;sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));sfx('tap');return}
      const b=e.target.closest('[data-b]');if(b){sfx('tap');done(buttons[+b.dataset.b].value);return}
      const it=e.target.closest('[data-i]');if(it&&cards){sfx('tap');done(cards[+it.dataset.i]);return}
      if(e.target===m&&closable)done(null);

function lvText(d){return d.kind==='xyz'?`ランク${d.rank}`:d.kind==='link'?`LINK-${d.link}`:`★${d.lv}`}
function subText(c){const d=c.d;if(d.type==='monster')return`${lvText(d)} ${d.attr}属性 ${d.race}族 / ATK ${d.atk}${d.kind==='link'?'':` DEF ${d.def}`}${d.tuner?' / チューナー':''}`;return d.type==='spell'?(d.sub==='field'?'フィールド魔法':d.sub?'永続魔法':'魔法カード'):(d.sub?'永続罠':'罠カード')}

async function act(fn){if(ui.busy)return;ui.busy=true;render();try{await fn()}catch(e){console.error(e)}finally{if(G&&!G.over)ui.busy=false;render()}}
function actionsFor(c,p=me()){
  const w=where(c),A=[];if(!w||G.over)return A;
  const mine=w.p===p,myTurn=G.cur===p.idx;
  if(!mine||!myTurn)return A;
  if(w.z==='hand'){
    if(c.d.type==='monster'&&canNormal(p,c)){
      const n=tribNeed(c,p);
      A.push({label:n?`生贄召喚（生贄${n}体）`:'召喚する',cls:'pri',fn:async()=>{const tr=n?await ask(p,()=>pickTributes(p,c)):[];if(tr)await normalSummon(p,c,tr,false)}});
      A.push({label:'裏側守備でセット',fn:async()=>{const tr=n?await ask(p,()=>pickTributes(p,c)):[];if(tr)await normalSummon(p,c,tr,true)}});
    }
    if(canSS(p,c))A.push({label:'特殊召喚（効果）',cls:'blue',fn:()=>doSS(p,c)});
    if(c.d.type==='spell'&&isMain()){
      if(canSpell(p,c))A.push({label:'発動する',cls:'pri',fn:async()=>{const pl=await ask(p,()=>planSpellHuman(p,c));if(pl)await activateSpell(p,c,pl)}});
      if(freeSz(p)>=0)A.push({label:'セットする',fn:()=>setST(p,c)});
    }
    if(c.d.type==='trap'&&isMain()&&freeSz(p)>=0)A.push({label:'セットする',cls:'pri',fn:()=>setST(p,c)});
  }else if(w.z==='mz'){
    if(canAttack(c))A.push({label:'攻撃する',cls:'red',fn:()=>humanAttack(c)});
    if(isMain()&&c.posTurn<G.turn&&c.attacks===0){
      if(!c.faceUp&&c.sumTurn<G.turn)A.push({label:'反転召喚',cls:'pri',fn:()=>flipSummon(p,c)});
      if(c.faceUp&&c.d.kind!=='link')A.push({label:c.pos==='atk'?'守備表示にする':'攻撃表示にする',fn:()=>changePos(p,c)});
    }
    if(canDetach(c))A.push({label:ignKey(c).startsWith('detach')?'効果発動（X素材を1つ使う）':'効果発動',cls:'blue',fn:async()=>{let t=null;if(ignKey(c)==='detachBreak'||ignKey(c)==='detachKill'){t=await ask(p,()=>pickOnBoard((ignKey(c)==='detachKill'?monsters(opp(p)):[...monsters(opp(p)),...sts(opp(p))]).filter(x=>!immune(x)&&!resists(x,'monster')),'破壊する相手のカードを選択',true));if(!t)return}await detach(p,c,t)}});
  }else if(w.z==='sz'){
    if(c.d.type==='trap'&&c.d.sub==='cont'&&!c.faceUp&&c.setTurn<G.turn&&isMain())A.push({label:'発動する',cls:'pri',fn:()=>activateContTrap(p,c)});
    if(c.d.type==='spell'&&!c.faceUp&&isMain()&&canSpell(p,c))A.push({label:'発動する',cls:'pri',fn:async()=>{const pl=await ask(p,()=>planSpellHuman(p,c));if(pl)await activateSpell(p,c,pl)}});
  }
  return A;
}
async function pickTributes(p,c){
  const need=tribNeed(c,p),ch=[];let n=0;
  while(n<need){
    const t=await pickOnBoard(monsters(p).filter(m=>!ch.includes(m)),`生贄にするモンスターを選択（あと${need-n}体分）`,true);
    if(!t){ui.marked.clear();render();return null}
    ch.push(t);ui.marked.add(t.uid);n+=tribVal(t,c);
  }
  ui.marked.clear();return ch;
}
async function humanAttack(a){
  const p=G.p[a.owner],o=opp(p);
  const r=await ask(p,async()=>{
    const tg=attackTargets(a);
    if(!monsters(o).length)return{d:1};
    if(has(a,'direct')&&canDirect(a)){
      const v=await modal({title:`${a.d.name}の攻撃`,buttons:[{label:'ダイレクトアタック',value:'d',cls:'red'},{label:'モンスターを攻撃',value:'m'},{label:'やめる',value:null,cls:'ghost'}]});
      if(v==='d')return{d:1};if(v!=='m')return null;
    }
    const t=await pickOnBoard(tg,`${a.d.name}の攻撃対象を選択${tg.length<monsters(o).length?'（挑発モンスターのみ）':''}`,true);
    return t?{t}:null;
  });
  if(r&&!G.over)await attack(a,r.d?null:r.t);
}

  if(v==='g')act(async()=>{if(G.opts.pvp)NET.send({t:'g',u:c.uid});await useGy(p,c)});

/* ===== 対人戦（PeerJSでP2P接続・ロックステップ同期） ===== */
const NET_VER='gsd-'+PACKDATA.length+'-'+Object.keys(DB).length;
const NET={q:[],w:null,tx:null,peer:null,conn:null,lobby:null,
  send(m){try{this.tx&&this.tx(m)}catch(e){console.error(e)}},
  onData(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'||m.t==='start'){this.lobby&&this.lobby(m);return}
    if(m.t==='surr'){if(G&&G.opts.pvp&&!G.over){finish(G.p[0],'相手が降参した');if(ui.pickRes)ui.pickRes(null);closeModal()}return}
    if(this.w){const r=this.w;this.w=null;r(m)}else this.q.push(m);
  },
  async wait(){
    if(this.q.length)return this.q.shift();
    document.body.classList.add('netw');
    const m=await new Promise(r=>this.w=r);
    document.body.classList.remove('netw');return m;
  },
  lost(){if(G&&G.opts.pvp&&!G.over){closeModal();finish(G.p[0],'相手との通信が切れた')}},
  close(){this.lobby=null;this.w=null;this.q=[];this.tx=null;try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.conn=null;this.peer=null}
};
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m.onclick=null;ui.modal=false}
function encV(v){if(v&&typeof v==='object'){if(v.uid&&v.d)return{__u:v.uid};if(Array.isArray(v))return v.map(encV);const o={};for(const k in v)o[k]=encV(v[k]);return o}return v===undefined?null:v}
function decV(v){if(v&&typeof v==='object'){if(v.__u)return byUid(v.__u);if(Array.isArray(v))return v.map(decV);const o={};for(const k in v)o[k]=decV(v[k]);return o}return v}
async function ask(p,fn){
  if(!G||!G.opts.pvp)return fn();
  if(!p.remote){const v=await fn();if(!G.over)NET.send({t:'d',v:encV(v)});return v}
  const m=await NET.wait();if(G.over)return null;
  if(m.t!=='d'){desync(m);return null}
  return decV(m.v);
}
function netPh(k){if(G&&G.opts.pvp)NET.send({t:'ph',v:k})}
function desync(m){console.error('desync',m);if(G&&!G.over){G.over=true;closeModal();toast('通信の同期がずれたため対戦を終了しました');setTimeout(toTitle,1500)}}
async function remoteTurn(p){
  while(!G.over){
    const m=await NET.wait();if(G.over)return;
    if(m.t==='ph'){if(m.v==='end')return;G.phase=m.v==='bp'?'battle':'main2';render();continue}
    try{
      if(m.t==='a'){const c=byUid(m.u),a=c&&actionsFor(c,p).find(x=>x.label===m.l);if(!a){desync(m);return}await a.fn()}
      else if(m.t==='x'){const f=byUid(m.u);if(!f){desync(m);return}const ms=await ask(p,()=>pickMaterials(p,f));if(ms)await extraSummon(p,f,ms)}
      else if(m.t==='g'){const c=byUid(m.u);if(!c){desync(m);return}await useGy(p,c)}
      else if(m.t==='d'){desync(m);return}
    }catch(e){console.error(e)}
    render();
  }
}
function loadPeer(){
  if(window.Peer)return Promise.resolve(true);
  const tryLoad=src=>new Promise(r=>{const sc=document.createElement('script');sc.src=src;sc.onload=()=>r(!!window.Peer);sc.onerror=()=>r(false);document.head.appendChild(sc)});
  return tryLoad('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js').then(ok=>ok||tryLoad('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'));
}
function pvpDeck(){const d=getDeck(window.__setDeck||SV.deck);return JSON.parse(JSON.stringify({name:d.name,icon:d.icon,desc:d.desc,main:d.main,extra:d.extra}))}
function startPvp(myG,seed,oppHello){
  closeModal();$('#title').hidden=true;
  startDuel({pvp:true,myG,seed,myDeck:pvpDeck(),myAv:SV.pav||'😎',oppDeck:oppHello.deck,oppName:oppHello.name,oppAv:oppHello.av||'🙂',lp:8000,story:null,cpuLv:2});
}
function netAttach(conn,host,setSt){
  NET.conn=conn;NET.tx=m=>conn.send(m);
  let opp=null,sentStart=false;
  NET.lobby=m=>{
    if(m.t==='hello'){
      if(m.v!==NET_VER){setSt('⚠ 相手とゲームのバージョンが違います。両方ともページを再読み込みしてください。');return}
      opp=m;setSt(`${m.av||'🙂'} ${m.name} さんと接続しました！`);
      if(host&&!sentStart){sentStart=true;const seed=Math.floor(Math.random()*2147483647);NET.q=[];NET.send({t:'start',seed});NET.lobby=null;setTimeout(()=>startPvp(0,seed,opp),600)}
    }else if(m.t==='start'&&!host&&opp){NET.q=[];NET.lobby=null;setTimeout(()=>startPvp(1,m.seed,opp),600)}
  };
  conn.on('data',m=>NET.onData(m));
  conn.on('close',()=>NET.lost());
  conn.on('error',()=>NET.lost());
  NET.send({t:'hello',v:NET_VER,name:SV.pname||'プレイヤー',av:SV.pav||'😎',deck:pvpDeck()});
}

async function roomConnect(host,code){
  NET.close();
  const pr=modal({title:host?'ルームを作成中…':'ルームに参加中…',html:`<div id="roomBox"><p class="desc" style="text-align:center">サーバーに接続しています…</p></div>`,closable:false,buttons:[{label:'キャンセル',value:null,cls:'ghost'}]});
  pr.then(()=>{if(!G)NET.close()});
  const setSt=t=>{const b=$('#roomBox');if(b)b.innerHTML=t.startsWith('<')?t:`<p class="desc" style="text-align:center">${t}</p>`};
  const ok=await loadPeer();
  if(!ok){setSt('⚠ 通信ライブラリを読み込めませんでした。インターネット接続を確認するか、GitHub Pages版で遊んでください。');return}
  const mk=id=>{try{return id?new Peer(id,{debug:0}):new Peer({debug:0})}catch(e){return null}};
  if(host){
    let tries=0;const go=()=>{
      const c=String(100000+Math.floor(Math.random()*900000));const peer=mk('gsduel-'+c);if(!peer){setSt('⚠ 接続に失敗しました');return}NET.peer=peer;
      peer.on('open',()=>setSt(`<p class="desc" style="text-align:center">このコードを相手に伝えてください</p><div class="roomcode">${c}</div><p class="desc" style="text-align:center">相手の参加を待っています…</p>`));
      peer.on('connection',conn=>{if(NET.conn){conn.close();return}conn.on('open',()=>netAttach(conn,true,setSt))});
      peer.on('error',e=>{if(e.type==='unavailable-id'&&tries++<4){peer.destroy();go()}else setSt('⚠ 接続エラー：'+(e.type||e))});
    };go();
  }else{
    const peer=mk(null);if(!peer){setSt('⚠ 接続に失敗しました');return}NET.peer=peer;
    peer.on('open',()=>{setSt(`ルーム ${code} に接続しています…`);const conn=peer.connect('gsduel-'+code,{reliable:true,serialization:'json'});conn.on('open',()=>netAttach(conn,false,setSt))});
    peer.on('error',e=>setSt(e.type==='peer-unavailable'?'⚠ ルームが見つかりません。コードを確認してください。':'⚠ 接続エラー：'+(e.type||e)));
  }
}

const packOpen=p=>!p.unlock||SV.cleared>=p.unlock;
const PACK_TOTAL=Object.values(DB).filter(d=>d.pack).length;
const ownedKinds=(pk)=>Object.keys(SV.owned).filter(id=>DB[id]&&(!pk||DB[id].pack===pk)&&SV.owned[id]>0).length;
const packCards=pk=>Object.values(DB).filter(d=>d.pack===pk);
function rollRar(slot){const r=Math.random();if(slot<3)return r<.72?'N':'R';if(slot===3)return r<.78?'R':r<.97?'SR':'UR';return r<.45?'R':r<.85?'SR':'UR'}
function openPack(pk){
  const pool=packCards(pk),res=[];
  for(let i=0;i<5;i++){
    let rar=rollRar(i),cs=pool.filter(d=>d.rar===rar);if(!cs.length)cs=pool;
    const d=cs[rnd(cs.length)],had=SV.owned[d.id]||0;
    let conv=0;if(had>=3){conv=20;SV.points+=conv}else SV.owned[d.id]=had+1;
    res.push({id:d.id,isNew:had===0,conv});
  }
  SV.packsOpened++;save();return res;
}
const PK={tab:'packs',col:1};
function openPackScreen(){$('#title').hidden=true;$('#packs').hidden=false;renderPacks()}
function renderPacks(){
  $('#pkPts').textContent=`🪙 ${SV.points}P`;
  $('#pkTabs').innerHTML=[['packs','パック'],['col','カード図鑑']].map(([k,l])=>`<button class="${PK.tab===k?'on':''}" data-pt="${k}">${l}</button>`).join('')+(PK.tab==='col'?PACKS.filter(packOpen).map(x=>`<button class="${PK.col===x.id?'on':''}" data-pc="${x.id}">${x.icon}${x.id}</button>`).join(''):'');
  if(PK.tab==='packs'){
    $('#pkBody').innerHTML=`<p class="pkinfo">1パック${PACK_COST}P・5枚入り（5枚目はスーパーレア以上の確率アップ）。ポイントはデュエルに勝つと手に入ります（フリー：よわい40P／ふつう70P／つよい100P、ストーリー初勝利は150〜400P、LP8000戦は1.2倍、負けても10P）。同じカードが4枚目以降になると20Pに変換されます。</p>`+
      PACKS.map(x=>{const own=ownedKinds(x.id),tot=packCards(x.id).length;if(!packOpen(x))return`<div class="pack locked"><div class="pic">🔒</div><div class="t"><b>？？？</b><small>ストーリー第${x.unlock}戦「${OPPS[x.unlock-1].name}」に勝つと解放</small><small>${x.desc}</small></div></div>`;return`<div class="pack" style="--c1:${x.c1};--c2:${x.c2}"><div class="pic">${x.icon}</div><div class="t"><b>${x.name}</b><small>${x.desc}</small><small>収録${tot}種・所持${own}種</small><div class="bar"><i style="width:${own/tot*100}%"></i></div></div><button class="pri" data-open="${x.id}" ${SV.points<PACK_COST?'disabled':''}>開封<br>${PACK_COST}P</button></div>`}).join('');
  }else{
    const cs=packCards(PK.col);
    $('#pkBody').innerHTML=`<p class="pkinfo">${PACKS[PK.col-1].name}：所持 ${ownedKinds(PK.col)}/${cs.length}種。持っているカードをタップすると詳細が見られます。</p><div class="colgrid">${cs.map(d=>{const n=SV.owned[d.id]||0;return n?`<div class="eitem" data-cc="${d.id}">${cardHTML(fakeCard(d.id),{plain:true})}<span class="cnt">${n}</span></div>`:`<div class="eitem"><div class="card back" style="--cw:64px"></div><span class="q">?</span></div>`}).join('')}</div>`;
  }
}

$('#pkBody').onclick=async e=>{
  const o=e.target.closest('[data-open]');if(o){sfx('tap');doOpen(+o.dataset.open);return}
  const c=e.target.closest('[data-cc]');if(c){sfx('tap');await modal({html:bigCardHTML(fakeCard(c.dataset.cc))+`<p class="desc" style="text-align:center;margin-top:8px">所持 ${SV.owned[c.dataset.cc]}枚</p>`,buttons:[{label:'閉じる',value:null,cls:'ghost'}]})}
};
function doOpen(pk){
  if(SV.points<PACK_COST||!packOpen(PACKS[pk-1]))return;
  SV.points-=PACK_COST;const res=openPack(pk);renderPacks();
  const pack=PACKS[pk-1],ov=document.createElement('div');ov.className='opening';
  const flipped=new Set();
  const draw=()=>{
    ov.innerHTML=`<h3>${pack.icon} ${pack.name}</h3><div class="row5">${res.map((r,i)=>{const d=DB[r.id];if(!flipped.has(i))return`<div class="slot fresh" data-fl="${i}" style="animation-delay:${i*.08}s"><div class="card back" style="animation-delay:${i*.08}s"></div></div>`;
      return`<div class="slot" data-dt="${i}">${r.isNew?'<span class="newb">NEW</span>':''}<span class="rlab"><span class="rar ${d.rar}">${d.rar}</span></span>${cardHTML(fakeCard(r.id),{plain:true,extraCls:'flip'})}${r.conv?`<span class="cv">+${r.conv}Pに変換</span>`:''}</div>`}).join('')}</div>
     <div class="desc" style="color:var(--muted);font-size:12px">${flipped.size<5?'カードをタップしてめくろう':'タップでカードの詳細'}　🪙 ${SV.points}P</div>
     <div class="btns">${flipped.size<5?'<button data-all="1">全部めくる</button>':`<button class="pri" data-again="1" ${SV.points<PACK_COST?'disabled':''}>もう1パック（${PACK_COST}P）</button><button data-close="1">閉じる</button>`}</div>`;
    ov.querySelectorAll('.slot.fresh').forEach(x=>{if(flipped.size)x.classList.remove('fresh')});
  };
  const flip=i=>{if(flipped.has(i))return;flipped.add(i);const d=DB[res[i].id];
    if(d.rar==='UR'||d.rar==='SR'){const f=document.createElement('div');f.className='flash';ov.appendChild(f);setTimeout(()=>f.remove(),600);sfx(d.rar==='UR'?'win':'spell')}else sfx('draw')};
  draw();document.body.appendChild(ov);sfx('summon');
  ov.onclick=async e=>{
    const f=e.target.closest('[data-fl]');if(f){flip(+f.dataset.fl);draw();return}
    if(e.target.closest('[data-all]')){for(let i=0;i<5;i++)flip(i);draw();return}
    const d=e.target.closest('[data-dt]');if(d){const id=res[+d.dataset.dt].id;await modal({html:bigCardHTML(fakeCard(id)),buttons:[{label:'閉じる',value:null,cls:'ghost'}]});return}
    if(e.target.closest('[data-close]')){ov.remove();renderPacks();return}
    if(e.target.closest('[data-again]')){ov.remove();doOpen(pk)}
  };
}

const ED={slot:0,name:'',main:{},extra:{},tab:'all',dirty:false};
const ED_TABS=[['all','すべて'],['new','パック'],['mon','モンスター'],['spell','魔法'],['trap','罠'],['ex','EX'],['in','デッキ内']];
const edMainN=()=>sum(Object.values(ED.main)),edExN=()=>sum(Object.values(ED.extra));
const edCount=id=>(isExtraD(DB[id])?ED.extra:ED.main)[id]||0;
const edMax=id=>Math.min(limitOf(id),DB[id].pack?SV.owned[id]||0:3);
const edAvail=id=>!DB[id].pack||(SV.owned[id]||0)>0;
function renderEditor(){
  const mn=edMainN(),en=edExN();
  $('#edName').innerHTML=`<b>${ED.name}${ED.dirty?' *':''}</b><small>メイン <b class="${mn<20||mn>40?'ng':''}">${mn}</b>/20〜40　EX <b class="${en>10?'ng':''}">${en}</b>/10</small>`;
  $('#edTabs').innerHTML=ED_TABS.map(([k,l])=>`<button class="${ED.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  const ids=Object.keys(DB).filter(id=>{const d=DB[id],t=ED.tab;
    if(!edAvail(id))return false;if(t==='new')return !!d.pack;
    if(t==='mon')return d.type==='monster'&&!isExtraD(d);if(t==='spell')return d.type==='spell';if(t==='trap')return d.type==='trap';if(t==='ex')return isExtraD(d);if(t==='in')return edCount(id)>0;return true});
  $('#edGrid').innerHTML=ids.length?ids.map(id=>{const n=edCount(id);return`<div class="eitem ${n?'':'zero'}" data-ed="${id}">${cardHTML(fakeCard(id),{plain:true})}${n?`<span class="cnt" ${n>limitOf(id)?'style="background:#d0213b"':''}>${n}</span>`:''}</div>`}).join(''):`<p class="desc" style="grid-column:1/-1;text-align:center;color:var(--muted)">${ED.tab==='new'?'パックのカードはまだ持っていません。バトルで勝ってポイントを集め、パックを開けましょう。':'まだカードが入っていません。「すべて」からカードを選んで追加してください。'}</p>`;
}
function edLoad(slot){
  const c=SV.custom[slot];ED.slot=slot;ED.dirty=false;ED.tab=c?'in':'all';
  ED.name=c?c.name:`マイデッキ${slot+1}`;ED.main=c?{...c.main}:{};ED.extra=c?{...c.extra}:{};
}
function edFromTemplate(k){
  const d=DECKS[k];let miss=0;ED.main={};ED.extra={};
  for(const id in d.main){const n=Math.min(d.main[id],edMax(id));miss+=d.main[id]-n;if(n>0)ED.main[id]=n}
  for(const id of d.extra){if((ED.extra[id]||0)<edMax(id)&&edExN()<10)ED.extra[id]=(ED.extra[id]||0)+1;else miss++}
  while(edMainN()>40){const id=Object.keys(ED.main).reduce((b,x)=>ED.main[x]>ED.main[b]||(ED.main[x]===ED.main[b]&&DB[x].type!=='monster')?x:b);if(--ED.main[id]<=0)delete ED.main[id]}
  ED.dirty=true;
  if(miss)setTimeout(()=>toast(`持っていない・制限中のカード${miss}枚を除いて読み込みました`),200);
}
const tplOwn=k=>{const d=DECKS[k],ids=[...new Set([...Object.keys(d.main),...d.extra])].filter(id=>DB[id].pack);return ids.length?`（所持 ${ids.filter(id=>(SV.owned[id]||0)>0).length}/${ids.length}種）`:''};
async function edTemplatePick(){
  const keys=['dragon','machine','magic','boss','g_gen',...THEMES.filter(t=>t.code!=='mo').map(t=>'t_'+t.code),...MIXES.map(m=>m[0])];

  if(v){edFromTemplate(v);ED.tab='in';renderEditor()}
}

function readCode(t){t=(t||'').trim().replace(/\s+/g,'');const m=t.match(/^GSD2:(.+)$/);if(!m)return null;try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));return o&&typeof o==='object'&&'points' in o&&'owned' in o?o:null}catch(e){return null}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}

    const ta=$('#svIn');ta.oninput=()=>txt=ta.value;ta.onclick=e=>e.stopPropagation();

      Object.assign(SV,o);save();renderTitle();toast('セーブデータを読み込みました');sfx('win')}}
};
const fmtD=t=>{const d=new Date(t+9*36e5);return`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`};

  const pr=modal({title:'禁止・制限リスト',html,buttons:[{label:'閉じる',value:null,cls:'ghost'}]});

const todayStr=(off=0)=>new Date(Date.now()+9*36e5+off*864e5).toISOString().slice(0,10);
const LOGIN=[100,100,150,150,200,200,500],BOUNTY_PTS=500,MISSION_ALL=200;
const MISSIONS=[
  {id:'p3',name:'デュエルを3回プレイ',pts:100,ok:D=>D.played>=3,pr:D=>[D.played,3]},
  {id:'w2',name:'デュエルに2回勝利',pts:150,ok:D=>D.won>=2,pr:D=>[D.won,2]},
  {id:'h1',name:'強敵に1勝（つよいCPU・ストーリー・賞金首）',pts:200,ok:D=>D.hard>=1,pr:D=>[D.hard,1]}];
function dailyState(){if(!SV.daily||SV.daily.date!==todayStr())SV.daily={date:todayStr(),played:0,won:0,hard:0,done:{}};return SV.daily}
function bountyToday(){const ks=[...THEMES.map(t=>'t_'+t.code),'boss'];let h=0;for(const ch of todayStr())h=(h*33+ch.charCodeAt(0))|0;const k=ks[Math.abs(h)%ks.length];
  const T=THEMES.find(t=>'t_'+t.code===k);return{deck:k,name:T?`賞金首 ${T.theme}の${['暴れ者','荒くれ','亡霊','覇者','狂戦士'][Math.abs(h>>3)%5]}`:'賞金首 混沌の化身',av:T?T.icon:'👑'}}
function bonusPending(){const D=dailyState();return SV.bountyWon!==todayStr()||MISSIONS.some(m=>!D.done[m.id])}
function loginHTML(){const st=SV.loginStreak||0,cur=((st-1)%7+7)%7;return`<div class="lgrid">${LOGIN.map((p,i)=>`<div class="${i<=cur&&st>0?'got':''} ${i===cur&&SV.lastLogin===todayStr()?'now':''}">${i+1}日目<b>${p}P</b></div>`).join('')}</div>`}
async function loginBonus(){
  const t=todayStr();if(SV.lastLogin===t)return;
  SV.loginStreak=SV.lastLogin===todayStr(-1)?(SV.loginStreak||0)+1:1;SV.lastLogin=t;

  await modal({title:'🎁 ログインボーナス',html:`<p class="desc" style="text-align:center">連続ログイン <b>${SV.loginStreak}</b>日目！ <b style="color:var(--gold)">+${p}P</b></p>${loginHTML()}<p class="desc" style="text-align:center;font-size:12px;color:var(--muted)">毎日ログインで7日目は500P！（途切れると1日目に戻ります）</p>`,buttons:[{label:'受け取る',value:null,cls:'pri'}]});
  sfx('win');
}

}

function showRules(){
  modal({title:'ルール説明',html:`<div class="rules">
  <h4>勝利条件</h4><ul><li>相手のライフポイント(LP)を0にすれば勝ち</li><li>ドローすべき時にデッキが0枚なら負け</li></ul>
  <h4>ターンの流れ</h4><ul><li><b>ドロー</b>：1枚引く（先攻1ターン目は引かない）</li><li><b>メイン1</b>：召喚・魔法・罠のセットなど</li><li><b>バトル</b>：攻撃表示モンスターで攻撃（先攻1ターン目は不可）</li><li><b>メイン2</b>：もう一度メインの行動</li><li><b>エンド</b>：手札は6枚まで</li></ul>
  <h4>召喚</h4><ul><li>通常召喚・セットは1ターンに1回</li><li>★5〜6は生贄1体、★7以上は生贄2体が必要</li><li>裏側守備でセットしたモンスターは次のターン以降「反転召喚」できる</li><li>融合モンスターは「融合の儀」で特殊召喚。素材は手札・場から自動で、なるべく価値の低いカードが選ばれる</li><li><b>特殊な融合</b>：「深淵融合」はデッキから、「魂の融合」「次元融合」は墓地から（素材は除外）、「強奪融合」は相手フィールドのモンスターも素材にできる</li></ul>
  <h4>EXデッキからの召喚</h4><ul><li>自分のメインフェイズに、EXデッキ（「EX」をタップ）から何度でも特殊召喚できる。召喚できる時は「EX」が光る</li><li><b>シンクロ</b>：チューナー1体＋チューナー以外の表側モンスターで、レベルの合計がちょうど一致すれば召喚。素材は墓地へ</li><li><b>エクシーズ</b>：同じレベルの表側モンスター2体を重ねて召喚。素材はX素材としてカードの下に残り（◉の数）、効果の発動に使う</li><li><b>リンク</b>：LINKの数と同じ数の表側モンスターを墓地へ送って召喚。守備力がなく、常に攻撃表示</li><li>融合・シンクロ・エクシーズ・リンクモンスターは召喚したターンから攻撃できる</li></ul>
  <h4>戦闘</h4><ul><li>攻撃表示同士：攻撃力が低い方が破壊され、差分がダメージ</li><li>守備表示への攻撃：攻撃力＞守備力なら破壊（ダメージなし）、攻撃力＜守備力なら攻撃側に差分ダメージ</li><li>相手フィールドにモンスターがいなければ直接攻撃</li><li>召喚したターンは表示形式を変更できない</li></ul>
  <h4>魔法・罠</h4><ul><li>魔法カードは自分のメインフェイズに発動</li><li>罠カードはセットし、<b>次の相手ターン以降</b>に条件（攻撃宣言・召喚）を満たすと発動を確認されます</li></ul>
  <h4>操作</h4><ul><li>カードをタップ → 詳細と行動を選択</li><li>光っている手札は今使えるカード</li><li>赤く光るモンスターは攻撃可能</li><li>「墓」「EX」をタップで中身を確認、ログ行をタップで履歴</li><li>タイトルの「デッキ編集」で自分だけのデッキを15個まで作れる（メイン20〜40枚、EX10枚まで、同名カード3枚まで）</li><li>デュエルに勝つとポイントがもらえ、「パック開封」で新しいカード（全${PACK_TOTAL}種）を手に入れられる。パックのカードは持っている枚数までデッキに入れられる</li><li>ポイントは「🎁ボーナス」でも稼げる：ログインボーナス（7日目500P）、デイリーミッション（全達成で計650P）、毎日現れる賞金首（撃破500P）、連勝ボーナス（最大×2）、ノーダメージ・速攻・大逆転勝利ボーナス</li><li><b>テーマの結束</b>：同じテーマのモンスターが自分フィールドに表側で2体いると、それらの攻撃力が300アップ（3体以上なら500アップ）</li><li><b>テーマの連携</b>：テーマカードの【連携】効果は、自分フィールドに他の同じテーマのモンスターがいる時だけ有効。テーマごとに生贄なしで上級モンスターを出す仕組みがある（手札から特殊召喚・生贄の軽減・仲間を呼ぶ効果・孵化など）。効果で呼び出されたモンスターの召喚時効果は発動しない</li><li>毎週月曜に「禁止・制限リスト」が更新される。マイデッキは禁止カードを入れられず、制限は1枚・準制限は2枚まで（毎週 禁止5枚・制限10枚・準制限10枚）</li><li><b>神のカード</b>：「神々の降臨」の神は他のカードの効果を一切受けず、通常召喚には生贄3体が必要。禁止・制限には選ばれない</li><li><b>特殊なEX召喚</b>：素材3体のエクシーズ、ランクアップ魔法（エクシーズの上に重ねてランクの高いエクシーズを出す）、魔法・罠5枚を墓地へ送って出す融合モンスター、「ユナイト」の融合魔法なしで出せる融合モンスターは、すべて「EX」から召喚する</li><li><b>魔力カウンター</b>：「マナ」はモンスターを使わず魔法カードだけで戦うテーマ。「マナ」のフィールド魔法は、自分か相手が魔法カードを発動するたびに魔力カウンターがたまる（「場」の✦の数字）。カウンターを使う効果で取り除く</li><li><b>効果耐性</b>：「モンスター効果耐性」「魔法耐性」を持つカードは、相手のその種類の効果では破壊・除外されず、対象にもならない（「マナ」のフィールド魔法はモンスター効果耐性）</li><li><b>発動の無効</b>：「封殺の鎖」の汎用カードで、相手のモンスター効果・魔法・罠の発動を無効にできる</li><li><b>送られた時の効果</b>：デッキから墓地へ送られた時・手札から墓地へ送られた時に発動する効果は、捨てる・デッキから落とす効果で自動的に発動する</li><li><b>墓地効果</b>：【墓地効果】を持つカードは、墓地にある時に自分のメインフェイズで発動できる（「墓」をタップ）</li><li><b>除外</b>：除外されたカードは墓地とは別の「除」に置かれ、通常は戻ってこない。「次元」テーマは除外されたカードを力に変え、除外から仲間を呼び戻す。「異次元の支配者」パックに収録</li><li><b>妨害モンスター</b>：【妨害】を持つモンスターは場に表側でいる間、相手の魔法発動・特殊召喚・攻撃を1ターンに1度止められる。手札誘発には召喚・攻撃・特殊召喚に反応するものもある</li><li>ストーリー第3戦・第6戦・第9戦に勝つと、新種族（天使族・恐竜族・昆虫族）のパックが解放される</li><li>ストーリー第1章（全13戦）をクリアすると「冥王の降臨」パックが解放され、第2章「混沌の覇王」（全10戦）が始まる。第2章では複数のテーマを混ぜた混合デッキの相手も登場する。第2章の第4戦まで勝つと「氷河と賢者の石」パックが解放される。第2章をクリアすると第3章「次元の彼方」（全10戦）が始まる</li><li><b>強化パック</b>：「強化パック 星と獣の章」「強化パック 刃と次元の章」には全テーマの新しいモンスター・EXモンスター・永続魔法やフィールド魔法・魔法罠が入っている。「汎用カードコレクション」はテーマに関係なくどのデッキにも入るカード集</li><li><b>永続魔法・永続罠・フィールド魔法</b>：発動後もフィールドに残り効果を発揮し続ける。永続罠はセットした次のターン以降、自分のメインフェイズか相手の攻撃宣言時に発動できる。フィールド魔法は各プレイヤー1枚までで、自分の情報欄の「場」チップで確認できる。「王国の礎」パックに収録</li><li><b>妨害</b>：罠カードには相手の魔法発動・特殊召喚に反応するものがある。手札誘発モンスター（護符の巫女など）は相手の行動に合わせて手札から捨てて発動できる（1ターンに1度）。「封印の結界」パックに収録</li><li><b>🗼 勝ち抜きタワー</b>：CPUと連続で戦い、何階まで勝ち抜けるかに挑戦。負けたら終了。上の階ほど相手が強くなり、報酬は階数×30P（5階ごとに+200P）</li><li><b>🤝 対人戦ルーム</b>：「ルームを作る」で表示される6桁のコードを相手に伝え、相手は「コードで参加」に入力すると、おたがいの使用デッキで対戦できる（LP8000・勝利60P）。インターネット接続が必要</li><li>進行は自動でセーブされる。「セーブデータ」からセーブコードを書き出せば、別の端末でも続きから遊べる</li></ul></div>`,buttons:[{label:'閉じる',value:null,cls:'ghost'}]});
