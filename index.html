<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>幻札デュエル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0b0d16;--panel:#171b2c;--panel2:#242a44;--line:rgba(255,255,255,.12);
  --text:#eef1ff;--muted:#9aa3c7;--gold:#f5c542;--red:#ff5a64;--blue:#5aa9ff;--green:#5fe39a;
  --cw:64px;--hw:74px;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 45%,#1f2447 0%,#0b0d16 72%) fixed;overflow:hidden}
button{font-family:var(--body);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 12px;font-weight:800}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:linear-gradient(180deg,#ffd76a,#e0a51c);color:#2b1a00;border:none}
button.red{background:linear-gradient(180deg,#ff6b74,#c8323d);color:#fff;border:none}
button.blue{background:linear-gradient(180deg,#6cb6ff,#2f6fd6);color:#fff;border:none}
button.ghost{background:transparent}
button.sm{padding:6px 10px;font-size:12px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- title ---------- */
#title{align-items:center;justify-content:center;gap:12px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.logo{text-align:center;margin-bottom:6px}
.logo .em{font-size:54px;filter:drop-shadow(0 0 18px rgba(255,190,80,.5));animation:float 3s ease-in-out infinite}
.logo h1{font-size:40px;letter-spacing:.04em;background:linear-gradient(180deg,#fff3c4,#f5c542 55%,#b8791a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2b00)}
.logo small{display:block;font-family:var(--display);color:var(--muted);letter-spacing:.35em;font-size:11px;margin-top:4px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:340px}
.menu button{padding:12px 6px;font-size:15px}
.menu .wide{grid-column:1/-1;padding:14px;font-size:16px}
.twr{display:flex;flex-direction:column;gap:6px;margin:6px 0}.twr div{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;font-size:14px}.twr b{color:var(--gold)}
.mydeck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);width:100%;max-width:300px;cursor:pointer}
.mydeck .ic{font-size:28px}
.mydeck .t{flex:1}
.mydeck .t small{display:block;color:var(--muted);font-size:11px}
.toggles{display:flex;gap:8px;margin-top:6px}
.rec{color:var(--muted);font-size:12px}

/* ---------- duel layout ---------- */
#duel{padding:4px 8px calc(4px + env(safe-area-inset-bottom));gap:4px;padding-top:max(4px,env(safe-area-inset-top))}
.pbar{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);flex:none;position:relative}
.pbar.turn{border-color:rgba(245,197,66,.7);box-shadow:0 0 10px rgba(245,197,66,.25)}
.pbar .av{font-size:20px}
.pbar .nm{font-weight:800;font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .lp{font-family:var(--display);font-size:20px;color:#fff;min-width:74px;text-align:right}
.pbar .lp small{font-size:10px;color:var(--gold);margin-right:3px}
.pbar .lp.low{color:#ff8a8a}
.chips{display:flex;gap:4px}
.chip{font-size:11px;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.chip b{color:#fff;margin-left:2px}
#ophand{height:24px;display:flex;justify-content:center;gap:3px;flex:none}
#ophand .cb{width:17px;height:24px;border-radius:3px;background:radial-gradient(ellipse at 50% 50%,#d88b3a 0 20%,#4a2410 22% 30%,#7a3f18 32%);border:1px solid #2b1407}
.row{display:grid;grid-template-columns:repeat(5,var(--cw));justify-content:center;gap:6px;flex:none}
.zone{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:6px;border:1px dashed rgba(255,255,255,.13);display:grid;place-items:center;position:relative}
.row.mz .zone{background:rgba(255,130,80,.05)}
.row.st .zone{background:rgba(80,210,170,.05)}
#mid{flex:1;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.phases{display:flex;justify-content:center;gap:3px}
.phases span{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:800}
.phases span.on{background:var(--gold);color:#2b1a00}
.ctrl{display:flex;gap:6px;align-items:center}
.ctrl .logline{flex:1;min-width:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 4px}
.ctrl button{padding:8px 10px;font-size:12px}
.prompt{display:flex;align-items:center;gap:8px;background:rgba(245,197,66,.14);border:1px solid rgba(245,197,66,.5);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:800}
.prompt span{flex:1}
#myhand{--cw:var(--hw);height:calc(var(--hw)*1.42 + 10px);display:flex;justify-content:center;align-items:flex-end;flex:none;padding-bottom:2px}
#myhand .card{flex:none;transition:transform .15s}
#myhand .card.can{box-shadow:0 0 0 2px var(--green),0 0 10px rgba(95,227,154,.7);transform:translateY(-6px)}

/* ---------- cards ---------- */
.card{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:5px;position:relative;padding:calc(var(--cw)*.05);display:flex;flex-direction:column;gap:2px;background:var(--fr);box-shadow:0 2px 6px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.35);color:#1a1205;overflow:hidden;cursor:pointer}
.card.monster.normal{--fr:linear-gradient(160deg,#f3d685,#b98d2e)}
.card.monster.effect{--fr:linear-gradient(160deg,#f5a868,#b45a1e)}
.card.monster.fusion{--fr:linear-gradient(160deg,#c4a0ff,#6a3fb3)}
.card.spell{--fr:linear-gradient(160deg,#6ddcb6,#1f7a5c)}
.card.trap{--fr:linear-gradient(160deg,#ee8fbf,#922f63)}
.card.monster.synchro,.big.monster.synchro{--fr:linear-gradient(160deg,#ffffff,#aab4c6)}
.card.monster.xyz,.big.monster.xyz{--fr:linear-gradient(160deg,#4d4d5c,#121218);color:#f3e9c6}
.card.monster.link,.big.monster.link{--fr:linear-gradient(160deg,#63a8ff,#1d4fa8);color:#fff}
.card.xyz .st .up,.card.link .st .up{color:#8dffa8}
.card .lv.rk{color:#1a1205;text-shadow:0 0 2px #ffe066,0 0 2px #ffe066}
.card .lv.lk{color:#bfe0ff}
.card .tn{position:absolute;left:2px;bottom:1px;font-size:calc(var(--cw)*.12);font-weight:800;background:#1d6b3a;color:#fff;border-radius:3px;padding:0 2px;line-height:1.2}
.card .ov{position:absolute;right:2px;bottom:1px;font-size:calc(var(--cw)*.13);font-weight:800;color:#ffe066;text-shadow:0 0 2px #000,0 0 2px #000}
.chip.can{border-color:var(--green);color:#fff;box-shadow:0 0 8px rgba(95,227,154,.7);animation:pulse .7s infinite alternate}
#editor{padding:6px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.edtop{display:flex;align-items:center;gap:8px;min-height:44px;flex:none}
.edtop .nm{flex:1;min-width:0}
.edtop .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edtop .nm small{font-size:12px;color:var(--muted)}
.edtop .nm small b{display:inline;font-size:12px;color:#fff}
.edtop .nm small b.ng{color:#ff8a8a}
.edtabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 6px;flex:none}
.edtabs button{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
.edtabs button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.edgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 6px;padding:8px 2px 12px;align-content:start}
.eitem{position:relative;display:flex;justify-content:center}
.eitem .card{--cw:64px}
.eitem.zero .card{opacity:.5}
.eitem .cnt{position:absolute;top:-6px;right:0;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 7px;z-index:2}
.edbot{display:flex;gap:6px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));flex:none}
.edbot button{flex:1;padding:10px 4px;font-size:13px}
#modal input{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.card .nm{font-size:calc(var(--cw)*.125);font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.card .art{flex:1;border-radius:3px;background:radial-gradient(circle at 50% 38%,var(--a1),var(--a2));display:grid;place-items:center;font-size:calc(var(--cw)*.4);position:relative;border:1px solid rgba(0,0,0,.35);min-height:0;line-height:1}
.card .lv{position:absolute;top:1px;right:2px;font-size:calc(var(--cw)*.12);color:#ffe066;text-shadow:0 0 2px #000,0 0 2px #000;font-weight:800;line-height:1}
.card .st{display:flex;justify-content:space-between;font-weight:800;font-size:calc(var(--cw)*.15);letter-spacing:-.03em;line-height:1;flex:none}
.card .st span{opacity:.45}
.card .st span.on{opacity:1}
.card .st .up{color:#064d16}.card .st .dn{color:#7a0a0a}
.card .st.sp{justify-content:center;font-family:var(--body);font-weight:800;font-size:calc(var(--cw)*.13);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card.back{background:radial-gradient(ellipse at 50% 50%,#e39a45 0 18%,#4a2410 20% 28%,#7a3f18 30% 60%,#5a2c10 62%);border:2px solid #2b1407}
.card.back::before{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#ffe2a8;font-size:calc(var(--cw)*.22)}
.card.fd{filter:saturate(.55) brightness(.75)}
.card.fd::after{content:'セット';position:absolute;left:0;right:0;top:42%;text-align:center;font-size:calc(var(--cw)*.14);background:rgba(0,0,0,.65);color:#fff;font-weight:800}
.zone .card.def{transform:rotate(-90deg) scale(.7)}
.card.t{outline:3px solid #ffe14a;outline-offset:1px;animation:pulse .7s infinite alternate}
.card.mk{outline:3px solid #ff5a64;outline-offset:1px}
.card.ready{box-shadow:0 0 0 2px var(--red),0 0 12px var(--red)}
.card.appear{animation:appear .35s ease-out}
.zone .card.def.appear{animation:appearDef .35s ease-out}
.card.flip{animation:flipin .4s ease-out}
.zone .card.def.flip{animation:flipinDef .4s ease-out}
.card.boom{animation:boom .45s forwards}
.zone .card.def.boom{animation:boomDef .45s forwards}
.card .eq{position:absolute;left:2px;top:1px;font-size:calc(var(--cw)*.13)}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
@keyframes appear{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
@keyframes appearDef{from{transform:rotate(-90deg) scale(1.3);opacity:0}to{transform:rotate(-90deg) scale(.7);opacity:1}}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
@keyframes flipinDef{from{transform:rotate(-90deg) scale(.7) rotateX(90deg)}to{transform:rotate(-90deg) scale(.7)}}
@keyframes boom{0%{filter:brightness(1)}30%{filter:brightness(3) saturate(0);transform:scale(1.1)}100%{opacity:0;transform:scale(.3) rotate(25deg);filter:brightness(3)}}
@keyframes boomDef{0%{filter:brightness(1)}30%{filter:brightness(3) saturate(0)}100%{opacity:0;transform:rotate(-60deg) scale(.2)}}
@keyframes float{50%{transform:translateY(-6px)}}

/* big card */
.big{--cw:200px;width:min(62vw,220px);margin:0 auto;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;background:var(--fr);color:#1a1205;box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.3)}
.big.monster.normal{--fr:linear-gradient(160deg,#f3d685,#b98d2e)}
.big.monster.effect{--fr:linear-gradient(160deg,#f5a868,#b45a1e)}
.big.monster.fusion{--fr:linear-gradient(160deg,#c4a0ff,#6a3fb3)}
.big.spell{--fr:linear-gradient(160deg,#6ddcb6,#1f7a5c)}
.big.trap{--fr:linear-gradient(160deg,#ee8fbf,#922f63)}
.big .bn{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;background:rgba(255,255,255,.35);border-radius:5px;padding:3px 6px}
.big .bn i{font-style:normal;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.big .stars{font-size:12px;color:#c0392b;text-align:right;letter-spacing:-1px;min-height:14px}
.big .bart{height:min(38vw,140px);border-radius:5px;background:radial-gradient(circle at 50% 38%,var(--a1),var(--a2));display:grid;place-items:center;font-size:min(20vw,76px);border:2px solid rgba(0,0,0,.4)}
.big .btx{color:#1a1205;background:rgba(255,248,230,.88);border-radius:5px;padding:6px 7px;font-size:12px;line-height:1.45;min-height:64px}
.big .btx b{display:block;font-size:11px}
.big .bst{display:flex;justify-content:flex-end;gap:10px;font-family:var(--display);font-size:14px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70}
#modal .box{width:100%;max-width:520px;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out;border-top:1px solid var(--line)}
#modal h3{font-size:17px;margin-bottom:10px;text-align:center}
#modal .desc{font-size:13px;color:#cfd5f5;line-height:1.6;margin:0 0 10px}
#modal .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer}
.pitem .card{--cw:46px;flex:none}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:13px}
.pinfo small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.seg{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;font-size:13px}
.seg button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.lab{font-size:12px;color:var(--muted);font-weight:800}
.opp{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;margin-bottom:8px}
.opp .ic{font-size:30px}
.opp .t{flex:1}
.opp .t small{display:block;color:var(--muted);font-size:11px}
.opp.lock{opacity:.4;cursor:default}
.opp .badge{font-size:11px;font-weight:800;color:var(--green)}
.talk{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.05);border-radius:12px;padding:12px;margin-bottom:6px}
.talk .ic{font-size:34px}
.talk p{margin:0;font-size:14px;line-height:1.6}
.talk b{display:block;font-size:12px;color:var(--gold)}
.rules{font-size:13px;line-height:1.7;color:#d7dcf5}
.rules h4{margin:12px 0 4px;color:var(--gold);font-size:14px}
.rules ul{margin:0;padding-left:18px}
.loglist{font-size:12px;line-height:1.6;color:#cfd5f5;max-height:55vh;overflow:auto}
.loglist div{border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}
.loglist .t0{color:#9fd0ff}.loglist .t1{color:#ffb0b0}
.decklist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.decklist .card{--cw:min(17vw,84px)}
.card.r-SR{box-shadow:0 0 0 2px #ffd34d,0 0 10px rgba(255,211,77,.8)}
.card.r-UR{box-shadow:0 0 0 2px #fff,0 0 10px #ff6bd6,0 0 18px #6bc8ff;animation:urglow 2s linear infinite}
@keyframes urglow{50%{filter:hue-rotate(40deg) brightness(1.15)}}
.rar{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.rar.N{background:#5b6280;color:#fff}.rar.R{background:#3a8dde;color:#fff}.rar.SR{background:linear-gradient(90deg,#ffd34d,#f5a623);color:#3a2300}.rar.UR{background:linear-gradient(90deg,#ff6bd6,#6bc8ff,#7dffb0);color:#1a1030}
.ptsbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.4);font-weight:800;width:100%;max-width:300px}
.ptsbar b{font-family:var(--display);font-size:20px;color:var(--gold)}
.ptsbar span{flex:1}
#packs{padding:6px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.pktop{display:flex;align-items:center;gap:8px;min-height:44px;flex:none}
.pktop .t{flex:1;font-family:var(--display);font-size:18px}
.pktop .pts{font-weight:800;color:var(--gold)}
.pktabs{display:flex;gap:6px;padding:4px 0 8px;flex:none;overflow-x:auto}
.pktabs button{padding:6px 12px;font-size:12px;flex:none}
.pktabs button.on{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.pkbody{flex:1;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.pack{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:10px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.pack .pic{width:64px;height:88px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:34px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.35);box-shadow:inset 0 0 18px rgba(255,255,255,.2)}
.pack .t{flex:1;min-width:0}
.pack .t b{display:block;font-size:15px}
.pack .t small{display:block;font-size:11px;color:rgba(255,255,255,.8);line-height:1.5}
.pack .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden}
.pack .bar i{display:block;height:100%;background:var(--gold)}
.pack button{flex:none;padding:10px 10px;font-size:12px}
.pkinfo{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 0 12px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 6px;padding:4px 2px 12px}
.colgrid .eitem .card.back{--cw:64px;opacity:.35}
.colgrid .eitem .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;pointer-events:none}
.opening{position:fixed;inset:0;z-index:55;background:radial-gradient(ellipse at 50% 40%,#2b2560,#07080f 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;animation:fadein .3s}
.opening h3{font-size:20px}
.opening .row5{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:440px}
.opening .slot{--cw:min(26vw,104px);position:relative;perspective:600px}
.opening .slot .card{transition:transform .35s}
.opening .slot.fresh .card{animation:dealin .4s ease-out backwards}
@keyframes dealin{from{transform:translateY(60px) scale(.6);opacity:0}}

  for(let i=1;i<=steps;i++){const v=Math.round(from+(to-from)*i/steps);G.lpShown[p.idx]=v;if(el)el.innerHTML=`<small>LP</small>${v}`;await sleep(30)}
  G.lpShown[p.idx]=to;render();
}
async function damage(p,n,battle){
  if(n<=0||G.over)return;if(battle){G.hitT=G.hitT||[];G.hitT[1-p.idx]=G.turn}if(!battle){G.burnT=G.burnT||[];G.burnT[1-p.idx]=G.turn}const from=p.lp;p.lp=Math.max(0,p.lp-n);p.lowLp=Math.min(p.lowLp??from,p.lp);
  log(`${p.name}に${n}ダメージ`,p.idx);sfx('dmg');floatTxt(p,'-'+n);shake();
  await animLP(p,from,p.lp);
  if(p.lp<=0)await finish(opp(p),'LPが0になった');
}
async function heal(p,n){G.healT=G.healT||[];G.healT[p.idx]=G.turn;const from=p.lp;p.lp+=n;log(`${p.name}のLPが${n}回復`,p.idx);sfx('heal');floatTxt(p,'+'+n,'heal');await animLP(p,from,p.lp)}
async function animAttack(a,t){
  const el=elOf(a);if(!el||window.__FAST)return;
  const tg=t?elOf(t):barOf(opp(G.p[a.owner]));if(!tg)return;
  const r1=el.getBoundingClientRect(),r2=tg.getBoundingClientRect();
  const dx=r2.left+r2.width/2-(r1.left+r1.width/2),dy=r2.top+r2.height/2-(r1.top+r1.height/2);
  el.style.position='relative';el.style.zIndex=30;el.style.transition='transform .22s ease-in';
  el.style.transform=`translate(${dx*.82}px,${dy*.82}px) scale(1.12)`;
  await sleep(230);sfx('hit');impactAt(tg);
  el.style.transition='transform .25s ease-out';el.style.transform='';await sleep(260);el.style.zIndex='';
}

/* ================= CORE ACTIONS ================= */
async function draw(p,n=1){
  for(let i=0;i<n;i++){
    if(!p.deck.length){log(`${p.name}のデッキが尽きた！`);await finish(opp(p),'デッキ切れ');return false}
    const c=p.deck.pop();c.faceUp=p.idx===0;p.hand.push(c);sfx('draw');render();await sleep(180);
  }
  return true;
}
function ssCond(p,c,k){const T=c.d.theme,tm=monsters(p).filter(m=>m!==c&&T&&m.d.theme===T);
  switch(k){case 'T':return tm.some(m=>m.faceUp);case 'def':return tm.some(m=>m.pos==='def');case 'many2':return tm.filter(m=>m.faceUp).length>=2;
    case 'grave3':return p.grave.filter(x=>x.d.type==='monster'&&x.d.theme===T).length>=3;case 'burn':return(G.burnT||[])[p.idx]===G.turn;case 'heal':return(G.healT||[])[p.idx]===G.turn;
    case 'lp':return p.lp>opp(p).lp;case 'spell':return(G.spellT||[])[p.idx]===G.turn;case 'cont':return contCards(p).length>0;case 'field':return !!p.fz[0];case 'neg':return G.turn-((G.negT||[])[p.idx]??-9)<=1;case 'st2':return sts(p).filter(x=>!x.faceUp).length>=2;case 'pay':return p.lp>1000;case 'hit':return(G.hitT||[])[p.idx]===G.turn;case 'set':return monsters(p).some(m=>m!==c&&!m.faceUp);case 'attr2':return new Set(monsters(p).filter(m=>m!==c&&m.faceUp).map(m=>m.d.attr)).size>=2;case 'turn':return G.turn>=5;case 'empty':return monsters(p).length===0;case 'disc':return p.hand.some(x=>x!==c&&x.d.theme===T)}return false}
const tribNeed=(c,p)=>{let b=c.d.lv>=7?2:c.d.lv>=5?1:0;if(b&&p&&has(c,'easy')&&ssCond(p,c,ev(c,'easy')))b--;if(b&&p&&c.d.theme&&pfx(p,'fEasyT').some(f=>f.c.d.theme===c.d.theme))b--;return b};
const tribVal=(m,c)=>(has(m,'doubleTribute')&&c.d.race==='ドラゴン')||(has(m,'dblTribT')&&m.d.theme&&m.d.theme===c.d.theme)?2:1;
const tribCap=(p,c)=>sum(monsters(p).map(m=>tribVal(m,c)));
function canNormal(p,c){
  if(p.ns||!isMain()||G.cur!==p.idx||c.d.type!=='monster'||isExtra(c))return false;
  const n=tribNeed(c,p);return n===0?freeMz(p)>=0:tribCap(p,c)>=n;
}
async function normalSummon(p,c,tribs,set){await normalSummon0(p,c,tribs,set);for(const t of tribs)if(!G.over)await hatchCheck(t)}
async function normalSummon0(p,c,tribs,set){
  for(const t of tribs){log(`${Q(t)}を生贄に捧げた`,p.idx);const e=elOf(t);if(e)e.classList.add('boom');}
  if(tribs.length){sfx('destroy');await sleep(420);tribs.forEach(toGrave)}
  removeCard(c);p.mz[freeMz(p)]=c;
  c.faceUp=!set;c.pos=set?'def':'atk';c.sumTurn=G.turn;c.posTurn=G.turn;c.attacks=0;p.ns=true;
  if(set){sfx('set');log(`${p.name}はモンスターをセットした`,p.idx);render();await sleep(450);return}
  sfx('summon');log(`${p.name}は${Q(c)}を${tribs.length?'生贄':''}召喚！`,p.idx);render();
  if(p.idx)await showActivate(c,'召喚！');else await sleep(450);
  await checkTraps({type:'summon',card:c,actor:p});
  if(G.over||!onField(c))return;
  await summonEffect(p,c);
}
async function putSS(p,t,how,set){
  if(freeMz(p)<0)return false;removeCard(t);t.owner=p.idx;t.faceUp=!set;t.pos=set?'def':'atk';t.grow=0;t.boost=0;t.sumTurn=G.turn;t.posTurn=G.turn;t.attacks=0;t.mats=null;p.mz[freeMz(p)]=t;
  sfx('summon');log(set?`${how}モンスターを裏側守備表示で特殊召喚`:`${how}${Q(t)}を特殊召喚！`,p.idx);render();await sleep(450);if(!set)await onSS(p,t);return true;
}
async function pickSS(p,c,cands,title,optional){
  if(!cands.length||freeMz(p)<0)return null;const uniq=cands.filter((x,i)=>cands.findIndex(y=>y.id===x.id)===i);
  if(p.cpu)return maxBy(uniq,x=>x.d.atk+(x.d.eff?100:0));
  return await ask(p,()=>modal({title,cards:uniq,buttons:optional?[{label:'特殊召喚しない',value:null,cls:'ghost'}]:[],closable:false}));
}
async function hatchCheck(c){
  if(G.over||!has(c,'hatch')||where(c)?.z!=='grave')return;const p=G.p[c.owner];
  const t=await pickSS(p,c,p.deck.filter(tPred(c,ev(c,'hatch'))),`${c.d.name}の効果：デッキから特殊召喚するモンスターを選択`,false);
  if(t){log(`${Q(c)}から新たな命が生まれる！`,p.idx);await putSS(p,t,'');shuffle(p.deck)}
}
function canSS(p,c){
  if(!G||c.d.type!=='monster'||isExtra(c)||!has(c,'ss')||G.cur!==p.idx||!isMain()||freeMz(p)<0||!p.hand.includes(c))return false;
  if((p.ssUsed||{})[c.id]===G.turn)return false;return ssCond(p,c,ev(c,'ss'));
}
async function doSS(p,c){
  const k=ev(c,'ss');
  if(k==='disc'){const cs=p.hand.filter(x=>x!==c&&x.d.theme===c.d.theme);
    const d=p.cpu?minBy(cs,x=>x.d.type==='monster'?x.d.atk:1500):await ask(p,()=>modal({title:`墓地へ送る「${c.d.theme}」カードを選択`,cards:cs,buttons:[{label:'やめる',value:null,cls:'ghost'}]}));
    if(!d)return false;toGrave(d);log(`${p.name}は${Q(d)}を墓地へ送った`,p.idx)}
  if(k==='pay'){const from=p.lp;p.lp-=1000;log(`${p.name}は1000LPを払った`,p.idx);sfx('dmg');await animLP(p,from,p.lp)}
  (p.ssUsed=p.ssUsed||{})[c.id]=G.turn;
  removeCard(c);c.faceUp=true;c.pos='atk';c.sumTurn=G.turn;c.posTurn=G.turn;c.attacks=0;p.mz[freeMz(p)]=c;
  sfx('summon');log(`${p.name}は${Q(c)}を手札から特殊召喚！`,p.idx);render();
  if(p.idx)await showActivate(c,'特殊召喚！');else await sleep(450);
  await onSS(p,c);if(G.over||!onField(c))return true;
  await summonEffect(p,c);return true;
}
async function doRider(p,c){
  if(!c.d.rider||G.over||!monsters(p).some(m=>m.faceUp&&m.d.theme===c.d.theme))return;
  const[k,v]=splitKV(c.d.rider);log(`${Q(c)}の連携効果！`,p.idx);
  if(k==='draw')await draw(p,v);else if(k==='heal')await heal(p,v);else if(k==='burn')await damage(opp(p),v);
  else if(k==='ssDeck'){const t=await pickSS(p,c,p.deck.filter(tPred(c,v)),`${c.d.name}の効果：デッキから特殊召喚する「${c.d.theme}」を選択`,true);if(t){await putSS(p,t,`${Q(c)}の効果で`);shuffle(p.deck)}}
  else if(k==='searchT')await searchDeck(p,c,x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===c.d.theme,true);
}
async function summonEffect(p,c){
  const o=opp(p);
  for(const e of FX(c)){
    if(G.over||!onField(c))return;
    const k=e.split(':')[0],v=ev(c,k);
    const say=()=>log(`${Q(c)}の効果！`,p.idx);
    if(k==='burnSum'){say();await damage(o,v)}
    else if(k==='drawSum'){log(`${Q(c)}の効果で${v}枚ドロー`,p.idx);await draw(p,v)}
    else if(k==='healSum'){say();await heal(p,v)}
    else if(k==='killSet'){const cs=monsters(o).filter(m=>!m.faceUp);if(cs.length){const t=await chooseTarget(p,cs,`${c.d.name}の効果：破壊する裏側モンスターを選択`,'kill');say();await destroyMany([t])}}
    else if(k==='freeze1'){const cs=monsters(o).filter(m=>m.faceUp&&m.pos==='atk'&&m.d.kind!=='link');if(cs.length){const t=await chooseTarget(p,cs,`${c.d.name}の効果：守備表示にするモンスターを選択`,'kill');t.pos='def';log(`${Q(c)}の効果で${Q(t)}が守備表示に`,p.idx);sfx('set');render();await sleep(400)}}
    else if(k==='freezeAll'){const cs=monsters(o).filter(m=>m.faceUp&&m.pos==='atk'&&m.d.kind!=='link');if(cs.length){cs.forEach(t=>t.pos='def');log(`${Q(c)}の効果で相手モンスターが全て守備表示に`,p.idx);sfx('set');render();await sleep(400)}}
    else if(k==='breakST'){const cs=sts(o);if(cs.length){if(v>=cs.length){say();await destroyMany(cs)}else for(let i=0;i<v;i++){const r=sts(o);if(!r.length)break;const t=await chooseTarget(p,r,`${c.d.name}の効果：破壊する魔法・罠を選択`,'st');say();await destroyMany([t])}}}
    else if(k==='kill'){for(let i=0;i<v;i++){const cs=monsters(o);if(!cs.length||G.over)break;const t=await chooseTarget(p,cs,`${c.d.name}の効果：破壊するモンスターを選択${v>1?`（${i+1}/${v}）`:''}`,'kill');say();await destroyMany([t])}}
    else if(k==='killWeak'){const cs=monsters(o).filter(m=>m.faceUp&&atkOf(m)<=v);if(cs.length){say();await destroyMany(cs)}}
    else if(k==='reviveLow'){const cs=p.grave.filter(x=>x.d.type==='monster'&&x.d.lv&&x.d.lv<=4&&!isExtra(x));if(cs.length&&freeMz(p)>=0){const t=p.cpu?maxBy(cs,x=>x.d.atk):await ask(p,()=>modal({title:`${c.d.name}の効果：特殊召喚するモンスターを選択`,cards:cs,closable:false}));say();await specialFromGrave(p,t)}}
    else if(k==='recoverSpell'){const cs=p.grave.filter(x=>x.d.type==='spell');if(cs.length){const t=p.cpu?minBy(cs,x=>spellPri(x.d.eff)):await ask(p,()=>modal({title:'墓地から手札に加える魔法カードを選択',cards:cs,closable:false}));removeCard(t);t.faceUp=p.idx===0;p.hand.push(t);log(`${Q(c)}の効果で${Q(t)}を手札に加えた`,p.idx);sfx('draw');render();await sleep(400)}}
    else if(k==='search')await searchDeck(p,c,x=>x.d.type==='monster'&&!isExtra(x)&&x.d.race===v&&x.d.lv<=4);
    else if(k==='placeCont')await placeFromDeck(p,c,'cont');
    else if(k==='placeField')await placeFromDeck(p,c,'field');
    else if(k==='recoverCont'){const cs=p.grave.filter(x=>x.d.sub);if(cs.length){const t=p.cpu?cs[cs.length-1]:await ask(p,()=>modal({title:'墓地から手札に加えるカードを選択',cards:cs,closable:false}));if(t){removeCard(t);t.faceUp=p.idx===0;p.hand.push(t);log(`${Q(c)}の効果で${Q(t)}を手札に加えた`,p.idx);sfx('draw');render();await sleep(400)}}}
    else if(k==='recoverTrap'){const cs=p.grave.filter(x=>x.d.type==='trap');if(cs.length){const t=p.cpu?cs[cs.length-1]:await ask(p,()=>modal({title:'墓地から手札に加える罠カードを選択',cards:cs,closable:false}));if(t){removeCard(t);t.faceUp=p.idx===0;p.hand.push(t);log(`${Q(c)}の効果で${Q(t)}を手札に加えた`,p.idx);sfx('draw');render();await sleep(400)}}}
    else if(k==='searchSpell')await searchDeck(p,c,x=>x.d.type==='spell');
    else if(k==='searchSpT')await searchDeck(p,c,x=>x.d.type!=='monster'&&x.d.theme===c.d.theme);
    else if(k==='callH'){const t=await pickSS(p,c,p.hand.filter(tPred(c,v)),`${c.d.name}の効果：手札から特殊召喚する「${c.d.theme}」を選択`,true);if(t)await putSS(p,t,`${Q(c)}の効果で`)}
    else if(k==='callD'){const t=await pickSS(p,c,p.deck.filter(x=>tPred(c,v)(x)&&x.id!==c.id),`${c.d.name}の効果：デッキから特殊召喚する「${c.d.theme}」を選択`,false);if(t){await putSS(p,t,`${Q(c)}の効果で`);shuffle(p.deck)}}
    else if(k==='raise'){const t=await pickSS(p,c,p.grave.filter(tPred(c,v)),`${c.d.name}の効果：墓地から特殊召喚する「${c.d.theme}」を選択`,true);if(t)await putSS(p,t,`${Q(c)}の効果で墓地から`)}
    else if(k==='mill'){const n=Math.min(v,Math.max(0,p.deck.length-1));for(let i=0;i<n;i++){const x=p.deck.pop();x.faceUp=true;p.grave.push(x)}if(n){log(`${Q(c)}の効果でデッキの上から${n}枚を墓地へ送った`,p.idx);render();await sleep(300)}}
    else if(k==='searchT')await searchDeck(p,c,x=>x.d.type==='monster'&&!isExtra(x)&&x.d.theme===c.d.theme&&x.d.lv<=4&&x.id!==c.id);
    else if(k==='specialHand'){const cs=p.hand.filter(x=>x.d.type==='monster'&&!isExtra(x)&&x.d.lv<=4);if(cs.length&&freeMz(p)>=0){
      let t;if(p.cpu)t=maxBy(cs,x=>x.d.atk);else t=await ask(p,()=>modal({title:`${c.d.name}の効果：特殊召喚するモンスターを選択`,cards:cs,buttons:[{label:'特殊召喚しない',value:null,cls:'ghost'}],closable:false}));
      if(t){removeCard(t);t.faceUp=true;t.pos='atk';t.sumTurn=G.turn;t.posTurn=G.turn;t.attacks=0;p.mz[freeMz(p)]=t;sfx('summon');log(`${Q(c)}の効果で${Q(t)}を特殊召喚！`,p.idx);render();await sleep(450)}}}
  }
}
async function placeFromDeck(p,c,sub){
  const cs=p.deck.filter(x=>x.d.type==='spell'&&x.d.sub===sub&&x.d.theme===c.d.theme);if(!cs.length||(sub==='cont'&&freeSz(p)<0))return;
  const u=cs.filter((x,i)=>cs.findIndex(y=>y.id===x.id)===i);
  const t=p.cpu?u[0]:await ask(p,()=>modal({title:`${c.d.name}の効果：置くカードを選択`,cards:u,buttons:[{label:'置かない',value:null,cls:'ghost'}],closable:false}));
  if(t&&!G.over){removeCard(t);shuffle(p.deck);await placeST(p,t,`${Q(c)}の効果で`)}
}
async function searchDeck(p,c,pred,quiet){
  const cs=p.deck.filter(pred);if(!cs.length){log(`${Q(c)}の効果：デッキに対象のカードがない`,p.idx);return}
  const uniq=cs.filter((x,i)=>cs.findIndex(y=>y.id===x.id)===i);
  const t=p.cpu?maxBy(uniq,x=>x.d.type==='spell'?2000-spellPri(x.d.eff)*100:x.d.atk):await ask(p,()=>modal({title:`${c.d.name}の効果：手札に加えるカードを選択`,cards:uniq,closable:false}));
  removeCard(t);t.faceUp=p.idx===0;p.hand.push(t);shuffle(p.deck);
  log(`${p.name}は${Q(c)}の効果で${p.idx===0||t.d.type!=='monster'?Q(t):'カード'}をデッキから手札に加えた`,p.idx);sfx('draw');render();await sleep(400);
}
async function destroyMany(list,reason){
  list=list.filter(onField);
  if(reason!=='battle'){const g=list.filter(c=>c.d.type==='monster'&&(pfx(G.p[c.owner],'fGuardAll').length||pfx(G.p[c.owner],'fGuardT').some(f=>c.d.theme&&f.c.d.theme===c.d.theme)));if(g.length){g.forEach(c=>log(`${Q(c)}は効果では破壊されない！`,c.owner));list=list.filter(c=>!g.includes(c))}}
  if(!list.length)return;
  list.forEach(c=>{if(c.d.type==='monster'&&!c.faceUp&&reason!=='battle'){c.faceUp=true}});
  render();
  list.forEach(c=>{const e=elOf(c);if(e)e.classList.add('boom')});
  sfx('destroy');await sleep(470);
  for(const c of list){log(`${Q(c)}は破壊された`,c.owner);toGrave(c)}
  render();
  for(const c of list){
    const p=G.p[c.owner];if(G.over)return;
    if(has(c,'drawDestroyed')){log(`${Q(c)}の効果で1枚ドロー`,p.idx);await draw(p,1)}
    if(has(c,'sd')&&where(c)?.z==='grave'){const v=ev(c,'sd');log(`${Q(c)}の効果！`,p.idx);await searchDeck(p,c,x=>x.d.type==='monster'&&!isExtra(x)&&x.d.lv<=4&&(v?x.d.race===v:x.d.theme===c.d.theme))}
    if(has(c,'hatch'))await hatchCheck(c);
    if(has(c,'burnBattleDestroyed')&&reason==='battle'){log(`${Q(c)}が爆発！`,p.idx);await damage(opp(p),ev(c,'burnBattleDestroyed'))}
  }
}
async function setST(p,c){removeCard(c);c.faceUp=false;c.setTurn=G.turn;p.sz[freeSz(p)]=c;sfx('set');log(`${p.name}は魔法・罠カードをセットした`,p.idx);render();await sleep(350)}
async function changePos(p,c){c.pos=c.pos==='atk'?'def':'atk';c.posTurn=G.turn;sfx('set');log(`${Q(c)}を${c.pos==='atk'?'攻撃':'守備'}表示に変更`,p.idx);render();await sleep(350)}
async function flipSummon(p,c){c.faceUp=true;c.pos='atk';c.posTurn=G.turn;sfx('summon');log(`${p.name}は${Q(c)}を反転召喚！`,p.idx);render();await sleep(450);await flipEffect(c)}
async function flipEffect(c){
  if(!onField(c))return;const p=G.p[c.owner];
  if(has(c,'flipKill')){const cs=monsters(opp(p));log(`${Q(c)}のリバース効果！`,p.idx);if(cs.length){const t=await chooseTarget(p,cs,`${c.d.name}の効果：破壊するモンスターを選択`,'kill');await destroyMany([t])}}
  if(has(c,'flipBurn')){log(`${Q(c)}のリバース効果！`,p.idx);await damage(opp(p),ev(c,'flipBurn'))}
  if(has(c,'flipDraw')){log(`${Q(c)}のリバース効果！`,p.idx);await draw(p,ev(c,'flipDraw'))}
  if(has(c,'flipCall')&&!G.over){const t=await pickSS(p,c,p.deck.filter(tPred(c,ev(c,'flipCall'))),`${c.d.name}の効果：デッキから裏側守備で特殊召喚するモンスターを選択`,false);if(t){log(`${Q(c)}のリバース効果！`,p.idx);await putSS(p,t,'',true);shuffle(p.deck)}}
}

async function specialFromGrave(p,t){
  if(where(t)?.z!=='grave'||freeMz(p)<0)return;
  removeCard(t);t.owner=p.idx;t.faceUp=true;t.pos='atk';t.grow=0;t.sumTurn=G.turn;t.posTurn=G.turn;t.attacks=0;t.mats=null;p.mz[freeMz(p)]=t;
  sfx('summon');log(`${Q(t)}が蘇った！`,p.idx);render();await sleep(500);await onSS(p,t);

/* ---------- synchro / xyz / link ---------- */
const XLAB={synchro:'シンクロ召喚',xyz:'エクシーズ召喚',link:'リンク召喚'};
const XCOL={synchro:'#ffffff',xyz:'#ffe066',link:'#63a8ff'};
const hasLv=m=>m.faceUp&&m.d.lv>0&&!['xyz','link'].includes(m.d.kind);
function validMat(f,set){

  return G.cur===p.idx&&G.phase==='battle'&&!G.battleEnded&&G.turn>1&&p.mz.includes(c)&&c.faceUp&&c.pos==='atk'&&c.noAtkTurn!==G.turn&&(c.attacks===0||(c.attacks===1&&(has(c,'dbl')||c.dblTurn===G.turn)&&monsters(G.p[1-c.owner]).length>0));
}
function attackTargets(a){const om=monsters(G.p[1-a.owner]);const tn=om.filter(m=>m.faceUp&&has(m,'taunt'));return tn.length?tn:om}
const canDirect=a=>a.attacks===0&&(!monsters(G.p[1-a.owner]).length||has(a,'direct'));
async function onKill(k,v,vAtk){

  if(!G.over&&has(k,'healKill')&&vAtk>0){log(`${Q(k)}の効果！`,p.idx);await heal(p,vAtk)}

}
async function battleDestroy(list){
  const safe=list.filter(x=>(x.faceUp&&has(x,'noBattleDeath'))||G.p[x.owner].mz.some(m=>m&&m!==x&&m.faceUp&&has(m,'guardT')&&m.d.theme&&m.d.theme===x.d.theme));
  safe.forEach(x=>log(`${Q(x)}は戦闘では破壊されない！`,x.owner));
  await destroyMany(list.filter(x=>!safe.includes(x)),'battle');
}
async function lootChk(a){if(G.over||!onField(a)||!has(a,'loot'))return;const p=G.p[a.owner];log(`${Q(a)}の効果で1枚ドロー`,p.idx);await draw(p,1)}
async function attack(a,t){

  await sleep(250);
  const neg=await checkTraps({type:'attack',attacker:a,target:t,actor:p});
  if(G.over||neg||!onField(a)){render();return}

  let best=null,bs=-1e9,bt=[];

    if(!canNormal(p,c))continue;
    const need=tribNeed(c,p);let tr=[],score;
    if(need){tr=cpuTributes(p,c);if(!tr)continue;const mx=Math.max(...tr.map(atkOf));if(c.d.atk<=mx+400)continue;score=c.d.atk-sum(tr.map(atkOf))*.4+300}
    else score=c.d.atk+(c.d.eff?150:0);
    if(has(c,'flipKill'))score=oAny?1700:300;
    if(score>bs){bs=score;best=c;bt=tr}
  }
  if(!best)return false;
  let set=false;
  if(has(best,'flipKill')||has(best,'flipDraw')||has(best,'flipCall'))set=true;
  else if(has(best,'taunt')||has(best,'noBattleDeath'))set=oAny&&best.d.atk<oBest?false:set;
  else if(oAny&&best.d.atk<oBest)set=true;
  else if(oAny&&best.d.atk<oBest+1&&best.d.def>best.d.atk)set=true;
  if(cpuLv()===0&&Math.random()<.15)set=!set;
  await normalSummon(p,best,bt,set);return true;
}
async function cpuMain(p,first){
  const o=opp(p);await sleep(300);
  if(first){
    for(const c of p.sz.filter(x=>x&&x.d.sub==='cont'&&x.d.type==='trap'&&!x.faceUp&&x.setTurn<G.turn)){if(G.over)return;await activateContTrap(p,c)}
    for(const m of monsters(p)){if(G.over)return;
      if(!m.faceUp&&m.sumTurn<G.turn&&m.posTurn<G.turn&&(((has(m,'flipKill')&&monsters(o).length)||has(m,'flipDraw'))||(m.d.atk>Math.max(0,...monsters(o).map(threat))&&m.d.atk>=1200))){await flipSummon(p,m);await sleep(200)}
      else if(m.faceUp&&m.pos==='def'&&m.posTurn<G.turn&&atkOf(m)>visAtk(o)&&atkOf(m)>=1000)await changePos(p,m);
    }
  }
  for(let g=0;g<14&&!G.over;g++){
    const sp=[...p.hand.filter(c=>c.d.type==='spell'),...sts(p).filter(c=>c.d.type==='spell')].sort((a,b)=>spellPri(a.d.eff)-spellPri(b.d.eff));
    let did=false;
    for(const c of sp){const plan=cpuSpellPlan(p,c);if(plan){await activateSpell(p,c,plan);await sleep(250);did=true;break}}
    if(did)continue;
    if(await cpuSS(p)){await sleep(250);continue}
    if(!p.ns&&await cpuSummon(p)){await sleep(250);continue}
    if(await cpuExtra(p)){await sleep(250);continue}
    if(first&&await cpuDetach(p)){await sleep(250);continue}
    break;
  }
  if(G.over)return;
  for(const c of p.hand.filter(c=>c.d.type==='trap')){if(freeSz(p)<0)break;await setST(p,c)}
  if(!first){
    const ob=visAtk(o);
    for(const m of monsters(p))if(m.faceUp&&m.pos==='atk'&&m.d.kind!=='link'&&m.posTurn<G.turn&&m.attacks===0&&atkOf(m)<ob)await changePos(p,m);
  }
}
async function cpuBattle(p){
  const o=opp(p);
  for(let g=0;g<10;g++){
    if(G.over||G.battleEnded)return;
    const list=monsters(p).filter(canAttack).sort((a,b)=>atkOf(b)-atkOf(a));if(!list.length)return;
    let A=null,T=null;
    for(const a of list){
      const om=attackTargets(a);if(canDirect(a)){A=a;break}
      const v=atkOf(a),kill=om.filter(t=>v>estDef(t));
      if(kill.length){A=a;T=maxBy(kill,t=>t.faceUp&&t.pos==='atk'?atkOf(t)+600:estDef(t));break}
    }
    if(!A)return;
    await attack(A,T);await sleep(350);
  }
}
async function cpuExtra(p){
  let best=null,bs=0;
  for(const f of p.extra){
    if(f.d.kind==='fusion'||(best&&best.f.id===f.id))continue;
    const sets=matSets(p,f);if(!sets.length)continue;
    const st=minBy(sets,x=>sum(x.map(m=>atkOf(m)+(m.d.kind==='xyz'||m.d.kind==='link'?800:0))));
    const score=f.d.atk-Math.max(...st.map(atkOf))-300+(f.d.eff?300:0)-(st.length-1)*150;
    if(score>bs){bs=score;best={f,st}}
  }
  if(!best)return false;
  await extraSummon(p,best.f,best.st);return true;
}
async function cpuDetach(p){
  const o=opp(p);
  for(const c of monsters(p)){
    if(!canDetach(c))continue;const k=ignKey(c);
    if(k==='detachDraw'&&p.deck.length>3){await detach(p,c,null);return true}
    if(k==='detachBreak'){const om=monsters(o);const t=om.length?maxBy(om,threat):sts(o)[0];if(t){await detach(p,c,t);return true}}
    if(k==='detachKill'){await detach(p,c,maxBy(monsters(o),threat));return true}
    if(k==='igHeal'&&p.lp<p.maxLp){await detach(p,c,null);return true}
    if(k==='igCall'){await detach(p,c,null);return true}
    if(k==='detachDouble'&&monsters(o).length<=1){await detach(p,c,null);return true}
    if(k==='igPump'){const tg=attackTargets(c);if(canDirect(c)||tg.some(t=>atkOf(c)<=estDef(t)&&atkOf(c)+ev(c,k)>estDef(t))){await detach(p,c,null);return true}}
    if(k==='igBurn'){const tg=attackTargets(c);if(!canDirect(c)&&!tg.some(t=>atkOf(c)>estDef(t))){await detach(p,c,null);return true}}
  }
  return false;
}
function cpuTrap(r,el,e){
  if(cpuLv()===0&&Math.random()<.4)return null;
  const f=k=>el.find(c=>spK(c)===k);
  if(e.type==='spell'){const c=f('negSpell');return c&&(spellPri(e.card.d.eff)<=4||Math.random()<.3)?c:null}
  if(e.type==='ssum'){const A=atkOf(e.card);if(f('killSS')&&(A>=1800||isExtra(e.card)))return f('killSS');if(f('nerf')&&A>=1600)return f('nerf');return null}
  if(e.type==='summon'&&f('bounce')&&(atkOf(e.card)>=1800||tribNeed(e.card)>0))return f('bounce');
  if(e.type==='summon'){if(f('summonBurn'))return f('summonBurn');const c=f('pit');return c&&(atkOf(e.card)>=1600||Math.random()<.25)?c:null}
  if(e.type==='attack'&&f('cont'))return f('cont');
  const a=e.attacker,A=atkOf(a),t=e.target;
  const harm=!t?A>=800:t.faceUp?(t.pos==='atk'?A>=atkOf(t):A>t.d.def):A>t.d.def;
  if(!harm)return null;
  const atkN=monsters(e.actor).filter(m=>m.faceUp&&m.pos==='atk').length;
  if(f('mirror')&&(atkN>=2||A>=2000))return f('mirror');
  if(f('spear')&&(A>=1500||!t))return f('spear');
  for(const k of ['counterBurn','freezeAtk','healGuard'])if(f(k)&&(A>=1400||!t))return f(k);
  if(f('shield')&&((!t&&A>=1000)||A>=1800||r.lp<=A))return f('shield');
  if(f('mirror')&&A>=1500)return f('mirror');
  return null;
}
async function cpuTurn(p){
  await cpuMain(p,true);if(G.over)return;
  if(G.turn>1&&monsters(p).some(canAttackSoon)){G.phase='battle';render();await sleep(400);await cpuBattle(p);if(G.over)return}
  G.phase='main2';render();await cpuMain(p,false);await sleep(300);
}
const canAttackSoon=m=>m.faceUp&&m.pos==='atk';

function pickOnBoard(cands,prompt,cancelable){

async function chooseTarget(p,cands,prompt,kind){

function modal({title='',html='',buttons=[],cards=null,cardLabel=null,closable=true,state=null}){
  return new Promise(res=>{
    ui.modal=true;const m=$('#modal');m.hidden=false;
    m.innerHTML=`<div class="box">${title?`<h3>${title}</h3>`:''}${html}${cards?`<div class="plist">${cards.map((c,i)=>`<div class="pitem" data-i="${i}">${cardHTML(c,{plain:true})}<div class="pinfo"><b>${c.d.name}</b><small>${cardLabel?cardLabel(c):subText(c)}</small><small>${c.d.text.replace(/\n/g,'<br>')}</small></div></div>`).join('')}</div>`:''}<div class="btns">${buttons.map((b,i)=>`<button class="${b.cls||''}" data-b="${i}" ${b.disabled?'disabled':''}>${b.label}</button>`).join('')}</div></div>`;
    const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;ui.modal=false;res(v)};
    m.onclick=e=>{
      const sg=e.target.closest('[data-seg]');if(sg&&state){const[k,v]=sg.dataset.seg.split(':');state[k]=isNaN(+v)?v:+v;sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));sfx('tap');return}
      const b=e.target.closest('[data-b]');if(b){sfx('tap');done(buttons[+b.dataset.b].value);return}
      const it=e.target.closest('[data-i]');if(it&&cards){sfx('tap');done(cards[+it.dataset.i]);return}
      if(e.target===m&&closable)done(null);

  });
}
function lvText(d){return d.kind==='xyz'?`ランク${d.rank}`:d.kind==='link'?`LINK-${d.link}`:`★${d.lv}`}
function subText(c){const d=c.d;if(d.type==='monster')return`${lvText(d)} ${d.attr}属性 ${d.race}族 / ATK ${d.atk}${d.kind==='link'?'':` DEF ${d.def}`}${d.tuner?' / チューナー':''}`;return d.type==='spell'?(d.sub==='field'?'フィールド魔法':d.sub?'永続魔法':'魔法カード'):(d.sub?'永続罠':'罠カード')}

async function act(fn){if(ui.busy)return;ui.busy=true;render();try{await fn()}catch(e){console.error(e)}finally{if(G&&!G.over)ui.busy=false;render()}}
function actionsFor(c,p=me()){
  const w=where(c),A=[];if(!w||G.over)return A;
  const mine=w.p===p,myTurn=G.cur===p.idx;
  if(!mine||!myTurn)return A;
  if(w.z==='hand'){
    if(c.d.type==='monster'&&canNormal(p,c)){
      const n=tribNeed(c,p);
      A.push({label:n?`生贄召喚（生贄${n}体）`:'召喚する',cls:'pri',fn:async()=>{const tr=n?await ask(p,()=>pickTributes(p,c)):[];if(tr)await normalSummon(p,c,tr,false)}});
      A.push({label:'裏側守備でセット',fn:async()=>{const tr=n?await ask(p,()=>pickTributes(p,c)):[];if(tr)await normalSummon(p,c,tr,true)}});
    }
    if(canSS(p,c))A.push({label:'特殊召喚（効果）',cls:'blue',fn:()=>doSS(p,c)});
    if(c.d.type==='spell'&&isMain()){
      if(canSpell(p,c))A.push({label:'発動する',cls:'pri',fn:async()=>{const pl=await ask(p,()=>planSpellHuman(p,c));if(pl)await activateSpell(p,c,pl)}});
      if(freeSz(p)>=0)A.push({label:'セットする',fn:()=>setST(p,c)});
    }
    if(c.d.type==='trap'&&isMain()&&freeSz(p)>=0)A.push({label:'セットする',cls:'pri',fn:()=>setST(p,c)});
  }else if(w.z==='mz'){
    if(canAttack(c))A.push({label:'攻撃する',cls:'red',fn:()=>humanAttack(c)});
    if(isMain()&&c.posTurn<G.turn&&c.attacks===0){
      if(!c.faceUp&&c.sumTurn<G.turn)A.push({label:'反転召喚',cls:'pri',fn:()=>flipSummon(p,c)});
      if(c.faceUp&&c.d.kind!=='link')A.push({label:c.pos==='atk'?'守備表示にする':'攻撃表示にする',fn:()=>changePos(p,c)});
    }
    if(canDetach(c))A.push({label:ignKey(c).startsWith('detach')?'効果発動（X素材を1つ使う）':'効果発動',cls:'blue',fn:async()=>{let t=null;if(ignKey(c)==='detachBreak'||ignKey(c)==='detachKill'){t=await ask(p,()=>pickOnBoard(ignKey(c)==='detachKill'?monsters(opp(p)):[...monsters(opp(p)),...sts(opp(p))],'破壊する相手のカードを選択',true));if(!t)return}await detach(p,c,t)}});
  }else if(w.z==='sz'){
    if(c.d.type==='trap'&&c.d.sub==='cont'&&!c.faceUp&&c.setTurn<G.turn&&isMain())A.push({label:'発動する',cls:'pri',fn:()=>activateContTrap(p,c)});
    if(c.d.type==='spell'&&!c.faceUp&&isMain()&&canSpell(p,c))A.push({label:'発動する',cls:'pri',fn:async()=>{const pl=await ask(p,()=>planSpellHuman(p,c));if(pl)await activateSpell(p,c,pl)}});
  }
  return A;
}
async function pickTributes(p,c){
  const need=tribNeed(c,p),ch=[];let n=0;
  while(n<need){
    const t=await pickOnBoard(monsters(p).filter(m=>!ch.includes(m)),`生贄にするモンスターを選択（あと${need-n}体分）`,true);
    if(!t){ui.marked.clear();render();return null}
    ch.push(t);ui.marked.add(t.uid);n+=tribVal(t,c);
  }
  ui.marked.clear();return ch;
}
async function humanAttack(a){

function bigCardHTML(c){

/* ===== 対人戦（PeerJSでP2P接続・ロックステップ同期） ===== */
const NET_VER='gsd-'+PACKDATA.length+'-'+Object.keys(DB).length;
const NET={q:[],w:null,tx:null,peer:null,conn:null,lobby:null,
  send(m){try{this.tx&&this.tx(m)}catch(e){console.error(e)}},
  onData(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'||m.t==='start'){this.lobby&&this.lobby(m);return}
    if(m.t==='surr'){if(G&&G.opts.pvp&&!G.over){finish(G.p[0],'相手が降参した');if(ui.pickRes)ui.pickRes(null);closeModal()}return}
    if(this.w){const r=this.w;this.w=null;r(m)}else this.q.push(m);
  },
  async wait(){
    if(this.q.length)return this.q.shift();
    document.body.classList.add('netw');
    const m=await new Promise(r=>this.w=r);
    document.body.classList.remove('netw');return m;
  },
  lost(){if(G&&G.opts.pvp&&!G.over){closeModal();finish(G.p[0],'相手との通信が切れた')}},
  close(){this.lobby=null;this.w=null;this.q=[];this.tx=null;try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.conn=null;this.peer=null}
};
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';m.onclick=null;ui.modal=false}
function encV(v){if(v&&typeof v==='object'){if(v.uid&&v.d)return{__u:v.uid};if(Array.isArray(v))return v.map(encV);const o={};for(const k in v)o[k]=encV(v[k]);return o}return v===undefined?null:v}
function decV(v){if(v&&typeof v==='object'){if(v.__u)return byUid(v.__u);if(Array.isArray(v))return v.map(decV);const o={};for(const k in v)o[k]=decV(v[k]);return o}return v}
async function ask(p,fn){
  if(!G||!G.opts.pvp)return fn();
  if(!p.remote){const v=await fn();if(!G.over)NET.send({t:'d',v:encV(v)});return v}
  const m=await NET.wait();if(G.over)return null;
  if(m.t!=='d'){desync(m);return null}
  return decV(m.v);
}
function netPh(k){if(G&&G.opts.pvp)NET.send({t:'ph',v:k})}
function desync(m){console.error('desync',m);if(G&&!G.over){G.over=true;closeModal();toast('通信の同期がずれたため対戦を終了しました');setTimeout(toTitle,1500)}}
async function remoteTurn(p){
  while(!G.over){
    const m=await NET.wait();if(G.over)return;
    if(m.t==='ph'){if(m.v==='end')return;G.phase=m.v==='bp'?'battle':'main2';render();continue}
    try{
      if(m.t==='a'){const c=byUid(m.u),a=c&&actionsFor(c,p).find(x=>x.label===m.l);if(!a){desync(m);return}await a.fn()}
      else if(m.t==='x'){const f=byUid(m.u);if(!f){desync(m);return}const ms=await ask(p,()=>pickMaterials(p,f));if(ms)await extraSummon(p,f,ms)}
      else if(m.t==='d'){desync(m);return}
    }catch(e){console.error(e)}
    render();
  }
}

  if(window.Peer)return Promise.resolve(true);
  const tryLoad=src=>new Promise(r=>{const sc=document.createElement('script');sc.src=src;sc.onload=()=>r(!!window.Peer);sc.onerror=()=>r(false);document.head.appendChild(sc)});
  return tryLoad('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js').then(ok=>ok||tryLoad('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'));
}

function netAttach(conn,host,setSt){
  NET.conn=conn;NET.tx=m=>conn.send(m);
  let opp=null,sentStart=false;
  NET.lobby=m=>{
    if(m.t==='hello'){
      if(m.v!==NET_VER){setSt('⚠ 相手とゲームのバージョンが違います。両方ともページを再読み込みしてください。');return}
      opp=m;setSt(`${m.av||'🙂'} ${m.name} さんと接続しました！`);
      if(host&&!sentStart){sentStart=true;const seed=Math.floor(Math.random()*2147483647);NET.q=[];NET.send({t:'start',seed});NET.lobby=null;setTimeout(()=>startPvp(0,seed,opp),600)}
    }else if(m.t==='start'&&!host&&opp){NET.q=[];NET.lobby=null;setTimeout(()=>startPvp(1,m.seed,opp),600)}
  };
  conn.on('data',m=>NET.onData(m));
  conn.on('close',()=>NET.lost());
  conn.on('error',()=>NET.lost());
  NET.send({t:'hello',v:NET_VER,name:SV.pname||'プレイヤー',av:SV.pav||'😎',deck:pvpDeck()});
}

function rollRar(slot){const r=Math.random();if(slot<3)return r<.72?'N':'R';if(slot===3)return r<.78?'R':r<.97?'SR':'UR';return r<.45?'R':r<.85?'SR':'UR'}

  const pool=packCards(pk),res=[];
  for(let i=0;i<5;i++){
    let rar=rollRar(i),cs=pool.filter(d=>d.rar===rar);if(!cs.length)cs=pool;

function showRules(){

  <h4>戦闘</h4><ul><li>攻撃表示同士：攻撃力が低い方が破壊され、差分がダメージ</li><li>守備表示への攻撃：攻撃力＞守備力なら破壊（ダメージなし）、攻撃力＜守備力なら攻撃側に差分ダメージ</li><li>相手フィールドにモンスターがいなければ直接攻撃</li><li>召喚したターンは表示形式を変更できない</li></ul>
